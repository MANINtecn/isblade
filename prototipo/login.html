<head>
<meta charset="utf-8">

<meta name="theme-color" content="#06070d">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Sora:wght@200;300;400;600;800&display=swap">
<link rel="stylesheet" href="css/portal.css?v=4">
<style>.topo{margin-bottom:6px}.topo h2{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,6vw,38px);color:var(--gold-2);letter-spacing:.12em;margin-top:8px}#cnt .cx{box-shadow:0 0 60px rgba(61,143,214,.18)}.volta{margin-top:22px;font-size:13px;color:var(--ink-3)}.volta a{border-bottom:1px solid var(--edge)}</style>
<script src="js/giro.js?v=1"></script>
</head>
<body>
<main class="centro">
  <div class="topo"><img class="logo p" src="icons/is-labs.png" alt="IS Labs"><h2>IS BLADE</h2></div>
  <div id="host"></div>
  <p class="volta"><a href="index.html">← voltar ao início</a></p>
</main>
<script src="js/conta.js?v=6"></script>
<script>
  /* [sso] 17/11/2026: a conta agora e' a do site (l2ikarus.com). Ja logado: direto ao carregamento -> selecao de personagem.
     Sem conta: volta ao site para entrar ou criar. O formulario antigo so' aparece em teste local ou com ?dev=1. */
  var DEV = /[?&]dev=1/.test(location.search) || /^(localhost|127\.0\.0\.1|192\.168\.)/.test(location.hostname);
  if(Conta.logado() && Conta.ssoAtivo){ Conta.liberaFluxo(); location.replace('carregando.html'); }
  else if(Conta.logado()) location.replace('painel.html');
  else if(!DEV && Conta.ssoAtivo) location.replace(Conta.site + '/?jogar=1');
  else Conta.telaLogin({ host: document.getElementById('host'), depois: 'painel.html', convidado: 'carregando.html' });
</script>
</body>
</html>
