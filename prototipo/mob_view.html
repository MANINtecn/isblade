<!doctype html><meta charset="utf-8"><title>Visualizador de monstros</title>
<body style="margin:0;background:#101826;color:#cfe0ff;font:13px system-ui"><div id="i" style="position:fixed;left:8px;top:8px;z-index:2"></div>
<script src="lib/three.min.js"></script><script src="lib/GLTFLoader.js"></script>
<script>
/* Ferramenta de conferencia: ?m=<arquivo em assets/mobs/modelos sem .glb>&clip=wait. A seta vermelha aponta +Z (a frente no jogo); a grade tem 1 m. */
var q=new URLSearchParams(location.search),nome=q.get('m')||'teste_ghost',clip=q.get('clip');
var R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var S=new THREE.Scene();S.background=new THREE.Color(0x1a2438);S.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));var d=new THREE.DirectionalLight(0xffffff,1.4);d.position.set(3,5,4);S.add(d);
S.add(new THREE.GridHelper(6,6,0x556677,0x334455));var ref=new THREE.Mesh(new THREE.BoxGeometry(.05,1,.05),new THREE.MeshBasicMaterial({color:0x44ff88}));ref.position.set(1,.5,0);S.add(ref);/* regua verde = 1 m */S.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(0,.02,0),1.5,0xff3344,.3,.2));
var C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,50);var cam=q.get('cam');if(cam==='f')C.position.set(0,.6,3.2);else if(cam==='b')C.position.set(0,.6,-3.2);else if(cam==='hf')C.position.set(0,.9,1.2);else if(cam==='hb')C.position.set(0,.9,-1.2);else if(cam==='t'){C.position.set(0,5,.01);}else C.position.set(2.6,1.3,3.4);C.lookAt(0,cam&&cam[0]==='h'?.9:.55,0);
new THREE.GLTFLoader().load('assets/mobs/modelos/'+nome+'.glb',function(g){
  var o=g.scene;S.add(o);var b=new THREE.Box3().setFromObject(o),n=g.animations.map(function(a){return a.name+':'+a.duration.toFixed(2)+'s';});
  document.getElementById('i').textContent=nome+' | altura '+(b.max.y-b.min.y).toFixed(2)+' | largura '+(b.max.x-b.min.x).toFixed(2)+' x '+(b.max.z-b.min.z).toFixed(2)+' | clips: '+n.join(', ');
  var mx=new THREE.AnimationMixer(o),c=g.animations.find(function(a){return a.name===(clip||'wait');})||g.animations[0];if(c)mx.clipAction(c).play();
  var t0=performance.now();(function loop(){requestAnimationFrame(loop);mx.update(.016);R.render(S,C);window.__ok=1;})();
},undefined,function(e){document.getElementById('i').textContent='ERRO '+e;});
</script>
