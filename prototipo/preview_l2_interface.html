<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>IS BLADE - Interface Oficial Lineage 2 Interlude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/l2_hud.css?v=37">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 35%, #182238 0%, #0a0d14 70%, #05070a 100%);
      color: #eaf2ff;
      font-family: 'Cinzel', Georgia, serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle, rgba(212,175,55,0.06) 1px, transparent 1px),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px, 80px 80px, 80px 80px;
      pointer-events: none;
    }
    .titulo-showcase {
      text-align: center;
      padding-top: 14px;
      position: relative;
      z-index: 10;
    }
    .titulo-showcase h1 {
      font-size: 18px;
      letter-spacing: 0.24em;
      color: #ffd166;
      text-shadow: 0 0 12px rgba(255,209,102,0.5), 0 2px 4px #000;
      text-transform: uppercase;
    }
    .titulo-showcase p {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: #8fa4c2;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }
    .layout-showcase {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 36px;
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .col-esq {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    #stp {
      display: block !important;
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      width: 320px !important;
      max-height: none !important;
    }
    #inv {
      display: block !important;
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      width: 256px !important;
      height: 382px !important;
      max-height: none !important;
    }
    #skp {
      display: block !important;
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      width: 256px !important;
      height: 335px !important;
      max-height: none !important;
    }
    #alvoMob {
      display: block !important;
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      width: 230px !important;
    }
  </style>
</head>
<body>

  <div class="titulo-showcase">
    <h1>IS BLADE &bull; Interface Oficial Lineage 2 Interlude</h1>
    <p>Target Window Compacta &bull; Character Status (U) &bull; Inventário Clássico Vertical 1:1 com Paperdoll e Grade 5x8 (I)</p>
  </div>

  <div class="layout-showcase">
    <!-- Coluna Esquerda: Target Window Compacta + Character Status (U) -->
    <div class="col-esq">
      <div id="alvoSlot"></div>
      <div id="stpSlot"></div>
    </div>

    <!-- Coluna Direita: Inventário Vertical 1:1 Oficial do Lineage 2 -->
    <div>
      <div id="invSlot"></div>
    </div>

    <!-- Coluna 3: Janela de Skills (MagicSkillWnd) 1:1 Oficial do Lineage 2 -->
    <div>
      <div id="skpSlot"></div>
    </div>
  </div>

  <script src="js/alvo_l2.js?v=30"></script>
  <script src="js/status.js?v=30"></script>
  <script src="js/inventario_ui.js?v=35"></script>
  <script src="js/skills_ui.js?v=35"></script>
  <script type="module">
    import { L2Hud } from './js/l2_hud.js?v=37';
    window.S = { php: 14500, pmax: 14500, st: 100, lvl: 80, xp: 1425000, gauge: 100, gmax: 100 };
    L2Hud.init();
  </script>
  <script>
    // 1. Target Window Compacta do Lineage 2 Interlude
    AlvoL2.atualiza({
      nome: 'Espantalho de Treino',
      tipo: 'dummy',
      nv: 1,
      hp: 99999,
      max: 99999,
      meuNv: 80
    });
    var alvoMob = document.getElementById('alvoMob');
    if(alvoMob) document.getElementById('alvoSlot').appendChild(alvoMob);

    // 2. Character Status (U)
    var stpEl = document.getElementById('stp');
    if(stpEl) {
      stpEl.classList.add('on');
      document.getElementById('stpSlot').appendChild(stpEl);
    }
    Status.abrir && Status.abrir({
      nome: 'Ikarus Herói',
      classe: 'Paladino Imperial',
      lvl: 80,
      xp: 1425000,
      xpMax: 2000000,
      pts: 5,
      attr: { for: 48, int: 22, agi: 36, vit: 45 }
    });

    // 3. Inventário Clássico Vertical do Lineage 2 (I)
    var invCaixa = document.createElement('div');
    invCaixa.id = 'inv';
    invCaixa.className = 'invui';
    document.getElementById('invSlot').appendChild(invCaixa);

    var ITENS_EXEMPLO = [
      { uid: 'w1', base: 'sword_long_c', grau: 'C', enc: 7, rar: 'raro', slot: 'weapon' },
      { uid: 's1', base: 'shield_guardian_c', grau: 'C', enc: 6, rar: 'raro', slot: 'weapon', weapon: 'shield' },
      { uid: 'h1', base: 'helmet_iron_c', grau: 'C', enc: 4, rar: 'incomum', slot: 'helmet' },
      { uid: 'c1', base: 'chest_plate_c', grau: 'C', enc: 5, rar: 'epico', slot: 'chest' },
      { uid: 'g1', base: 'gloves_hide_c', grau: 'C', enc: 4, rar: 'incomum', slot: 'gloves' },
      { uid: 'b1', base: 'boots_swift_c', grau: 'C', enc: 4, rar: 'incomum', slot: 'boots' },
      // Mochila com armas D e normais, cajados, pocoes, soulshots
      { uid: 'w2', base: 'sword_long_d', grau: 'D', enc: 3, rar: 'incomum', slot: 'weapon' },
      { uid: 'w3', base: 'staff_arcane_c', grau: 'C', enc: 4, rar: 'raro', slot: 'weapon', weapon: 'staff' },
      { uid: 'w4', base: 'staff_arcane_d', grau: 'D', enc: 0, rar: 'comum', slot: 'weapon', weapon: 'staff' },
      { uid: 's2', base: 'shield_guardian_d', grau: 'D', enc: 0, rar: 'comum', slot: 'weapon', weapon: 'shield' },
      { uid: 'c2', base: 'chest_plate_d', grau: 'D', enc: 2, rar: 'comum', slot: 'chest' }
    ];

    var ITM_DICT = {
      sword_long_c: { id: 'sword_long_c', name: 'Berserker Blade', slot: 'weapon', grau: 'C', atk: 185 },
      shield_guardian_c: { id: 'shield_guardian_c', name: 'Full Plate Shield', slot: 'weapon', weapon: 'shield', grau: 'C', def: 120 },
      helmet_iron_c: { id: 'helmet_iron_c', name: 'Composite Helmet', slot: 'helmet', grau: 'C', def: 62 },
      chest_plate_c: { id: 'chest_plate_c', name: 'Full Plate Armor', slot: 'chest', grau: 'C', def: 240 },
      gloves_hide_c: { id: 'gloves_hide_c', name: 'Composite Gauntlets', slot: 'gloves', grau: 'C', def: 48 },
      boots_swift_c: { id: 'boots_swift_c', name: 'Composite Boots', slot: 'boots', grau: 'C', def: 48 },
      sword_long_d: { id: 'sword_long_d', name: 'Claymore', slot: 'weapon', grau: 'D', atk: 112 },
      staff_arcane_c: { id: 'staff_arcane_c', name: "Ghoul's Staff", slot: 'weapon', weapon: 'staff', grau: 'C', matk: 165 },
      staff_arcane_d: { id: 'staff_arcane_d', name: 'Ghost Staff', slot: 'weapon', weapon: 'staff', grau: 'D', matk: 95 },
      shield_guardian_d: { id: 'shield_guardian_d', name: 'Composite Shield', slot: 'weapon', weapon: 'shield', grau: 'D', def: 85 },
      chest_plate_d: { id: 'chest_plate_d', name: 'Brigandine Tunic', slot: 'chest', grau: 'D', def: 145 }
    };

    var estadoInv = {
      itm: {
        bases: ITM_DICT,
        slots: { helmet: 'Elmo', weapon: 'Arma', chest: 'Peitoral', gloves: 'Luvas', boots: 'Botas' },
        rarities: {
          comum: { name: 'Comum', css: '#9e9e9e' },
          incomum: { name: 'Incomum', css: '#4ade80' },
          raro: { name: 'Raro', css: '#38bdf8' },
          epico: { name: 'Épico', css: '#c084fc' }
        }
      },
      inv: {
        items: ITENS_EXEMPLO.slice(6),
        equip: {
          helmet: ITENS_EXEMPLO[2],
          weapon: ITENS_EXEMPLO[0],
          chest: ITENS_EXEMPLO[3],
          gloves: ITENS_EXEMPLO[4],
          boots: ITENS_EXEMPLO[5]
        }
      },
      st: { for: 48, int: 22, agi: 36, vit: 45 },
      pmax: 14500,
      conj: null,
      adena: 2458900,
      consum: {},
      lvl: 80,
      lojaDados: null
    };

    var ops = {
      equip: function(uid){ console.log('Equipar', uid); },
      tirar: function(slot){ console.log('Tirar', slot); },
      descartar: function(uid){ console.log('Descartar', uid); },
      usar: function(id){ console.log('Usar', id); },
      fechar: function(){},
      statsDe: function(it){
        var b = ITM_DICT[it.base];
        return b ? ('P.Atk +' + (b.atk||0) + ' | P.Def +' + (b.def||0)) : '';
      },
      nome: function(it){
        var b = ITM_DICT[it.base];
        return b ? b.name : it.base;
      }
    };

    InvUI.render(invCaixa, estadoInv, ops);

    // 4. Janela de Habilidades (MagicSkillWnd) do Lineage 2 Interlude
    var skpCaixa = document.createElement('div');
    skpCaixa.id = 'skp';
    skpCaixa.className = 'open';
    document.getElementById('skpSlot').appendChild(skpCaixa);

    var SKILLS_EXEMPLO = [
      { name: 'Power Strike', ico: 'assets/icones/sword_long.png', desc: 'Golpe poderoso no alvo', unlock: 1, range: 4 },
      { name: 'Mortal Blow', ico: 'assets/icones/sword_long.png', desc: 'Ataque crítico letal', unlock: 5, range: 4 },
      { name: 'Whirlwind', ico: 'assets/icones/sword_long.png', desc: 'Giro devastador em 360 graus', unlock: 10, range: 6 },
      { name: 'War Cry', ico: 'assets/icones/sword_long.png', desc: 'Grito de guerra que eleva o P.Atk', unlock: 20 },
      { name: 'Thunder Storm', ico: 'assets/icones/sword_long.png', desc: 'Tempestade elétrica que atordoa', unlock: 30, range: 8 },
      { name: 'Ultimate Defense', ico: 'assets/icones/shield_guardian.png', desc: 'Defesa absoluta por 15 segundos', unlock: 40 }
    ];

    SkillsUI.render(skpCaixa, { name: 'Berserker Blade' }, SKILLS_EXEMPLO, 80, {
      fechar: function(){},
      skillCands: function(i){ return [SKILLS_EXEMPLO[i]]; }
    });
  </script>
</body>
</html>
