<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IS BLADE - Criação de Personagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030611;
  --panel: rgba(8, 14, 28, 0.88);
  --panel-border: rgba(245, 196, 81, 0.35);
  --gold: #f5c451;
  --gold-glow: rgba(245, 196, 81, 0.45);
  --cyan: #5aa9ff;
  --cyan-glow: rgba(90, 169, 255, 0.4);
  --text: #eaf1fb;
  --dim: #8b9bb4;
}
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Outfit', sans-serif; color:var(--text); }
#canvas-wrap { position:absolute; inset:0; z-index:1; }
#webgl { width:100%; height:100%; display:block; }

/* Overlay UI */
.ui-layer { position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:14px 24px 18px; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:center; }
.logo-box { display:flex; flex-direction:column; }
.logo-title { font-family:'Cinzel', serif; font-size:24px; font-weight:900; letter-spacing:0.12em; color:#fff; text-shadow:0 0 20px var(--cyan-glow); }
.logo-title span { color:var(--gold); }
.logo-sub { font-size:10.5px; font-weight:600; letter-spacing:0.2em; color:var(--dim); text-transform:uppercase; margin-top:2px; }

.top-actions { display:flex; gap:12px; pointer-events:auto; }
.top-btn { background:var(--panel); border:1px solid var(--panel-border); color:var(--gold); padding:6px 14px; border-radius:6px; font-size:11.5px; font-weight:700; text-decoration:none; cursor:pointer; transition:all .2s; backdrop-filter:blur(8px); display:inline-flex; align-items:center; gap:6px; }
.top-btn:hover { background:rgba(245, 196, 81, 0.2); border-color:var(--gold); transform:translateY(-1px); box-shadow:0 0 15px var(--gold-glow); }

/* Left Customization Panel */
.main-content { display:flex; justify-content:space-between; align-items:center; flex:1; pointer-events:none; min-height:0; margin:6px 0; }
.side-panel { width:330px; background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:16px; backdrop-filter:blur(14px); box-shadow:0 10px 40px rgba(0,0,0,0.85); pointer-events:auto; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 150px); overflow-y:auto; }
.side-panel::-webkit-scrollbar { width:4px; }
.side-panel::-webkit-scrollbar-thumb { background:var(--panel-border); border-radius:2px; }

/* Right Attributes & Lore Panel */
.right-panel { width:270px; background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:16px; backdrop-filter:blur(14px); box-shadow:0 10px 40px rgba(0,0,0,0.85); pointer-events:auto; display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 150px); overflow-y:auto; }
.right-panel::-webkit-scrollbar { width:4px; }
.right-panel::-webkit-scrollbar-thumb { background:var(--panel-border); border-radius:2px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-bottom:3px; }
.stat-label { font-weight:700; color:var(--text); }
.stat-val { font-weight:800; color:var(--gold); }
.stat-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin-bottom:8px; border:1px solid rgba(255,255,255,0.05); }
.stat-fill { height:100%; background:linear-gradient(90deg, #5aa9ff, var(--gold)); border-radius:3px; }
.lore-text { font-size:11px; line-height:1.55; color:var(--dim); font-style:italic; border-left:2px solid var(--gold); padding-left:10px; margin:2px 0 6px; }
.feature-badge { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:#d2e5ff; background:rgba(90, 169, 255, 0.1); border:1px solid rgba(90, 169, 255, 0.25); border-radius:4px; padding:4px 8px; }

.section-title { font-family:'Cinzel', serif; font-size:12px; font-weight:800; letter-spacing:0.15em; color:var(--gold); text-transform:uppercase; border-bottom:1px solid rgba(245, 196, 81, 0.2); padding-bottom:6px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
.section-title small { font-family:'Outfit', sans-serif; font-size:10px; color:var(--dim); letter-spacing:0; font-weight:400; }

/* Grid Buttons */
.opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt-card { background:rgba(15, 23, 42, 0.7); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:10px 8px; cursor:pointer; text-align:center; transition:all .18s; position:relative; overflow:hidden; }
.opt-card:hover { border-color:rgba(90, 169, 255, 0.5); background:rgba(90, 169, 255, 0.12); }
.opt-card.active { border-color:var(--gold); background:rgba(245, 196, 81, 0.16); box-shadow:0 0 12px var(--gold-glow); }
.opt-card.disabled { opacity:0.35; cursor:not-allowed; }
.opt-name { font-size:12px; font-weight:700; color:#fff; display:block; }
.opt-card.active .opt-name { color:var(--gold); }
.opt-sub { font-size:9.5px; color:var(--dim); margin-top:2px; display:block; }
.opt-badge { position:absolute; top:3px; right:4px; font-size:8px; font-weight:800; background:rgba(255,255,255,0.12); padding:1px 4px; border-radius:3px; color:#aaa; text-transform:uppercase; }

/* Name Input */
.name-input-wrap { display:flex; flex-direction:column; gap:6px; }
.name-input { width:100%; height:38px; background:rgba(5, 10, 20, 0.85); border:1.5px solid var(--panel-border); border-radius:6px; padding:0 12px; font-family:'Cinzel', serif; font-size:14px; font-weight:700; color:var(--gold); outline:none; transition:all .2s; }
.name-input:focus { border-color:var(--gold); box-shadow:0 0 16px var(--gold-glow); }

/* Animation Action Demo Buttons */
.anim-row { display:flex; gap:6px; flex-wrap:wrap; }
.anim-btn { flex:1 1 30%; background:rgba(15, 23, 42, 0.8); border:1px solid rgba(255,255,255,0.1); border-radius:4px; padding:6px 4px; font-size:10px; font-weight:700; color:var(--dim); cursor:pointer; text-align:center; transition:all .15s; }
.anim-btn:hover { background:rgba(90, 169, 255, 0.2); color:#fff; border-color:var(--cyan); }
.anim-btn.active { background:var(--cyan); color:#030611; border-color:var(--cyan); font-weight:800; }

/* Footer / Enter Button */
.footer-bar { display:flex; justify-content:center; align-items:center; pointer-events:auto; padding-top:12px; }
.enter-btn { background:linear-gradient(135deg, #f5c451, #e5a720); border:none; border-radius:30px; padding:16px 48px; font-family:'Cinzel', serif; font-size:15px; font-weight:900; letter-spacing:0.18em; color:#060a14; cursor:pointer; box-shadow:0 0 30px var(--gold-glow), 0 8px 24px rgba(0,0,0,0.6); transition:all .22s; display:inline-flex; align-items:center; gap:12px; text-transform:uppercase; }
.enter-btn:hover { transform:scale(1.04) translateY(-2px); box-shadow:0 0 45px var(--gold-glow), 0 12px 30px rgba(0,0,0,0.8); filter:brightness(1.1); }
.enter-btn:active { transform:scale(0.98); }

/* Hint */
.drag-hint { position:absolute; bottom:30px; left:36px; font-size:11px; font-weight:600; color:rgba(255,255,255,0.4); display:flex; align-items:center; gap:6px; pointer-events:none; }
.drag-hint span { display:inline-block; border:1px solid rgba(255,255,255,0.25); border-radius:12px; padding:2px 8px; font-size:9.5px; }

/* Color Palette for Hair */
.color-palette { display:flex; gap:8px; align-items:center; }
.color-swatch { width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,0.25); cursor:pointer; transition:all .2s; }
.color-swatch:hover { transform:scale(1.15); border-color:#fff; }
.color-swatch.active { border-color:var(--gold); box-shadow:0 0 10px var(--gold-glow); transform:scale(1.18); }

/* Flash transition */
#transition-overlay { position:fixed; inset:0; background:#fff; z-index:9999; opacity:0; pointer-events:none; transition:opacity .5s ease; }

.logo-box { left:14px; top:8px; pointer-events:none; }

.back { right:12px; top:8px; padding:6px 12px; }

.tabs { display:flex; gap:4px; padding:6px 6px 0; position:sticky; top:0; background:var(--panel); z-index:2; }
.tab { flex:1; padding:7px 0; border:0; border-radius:7px 7px 0 0; background:rgba(255,255,255,.06); color:var(--dim); font:700 12px 'Outfit',sans-serif; cursor:pointer; }
.tab.on { background:rgba(245,196,81,.18); color:var(--gold); }

.lbl small { color:var(--dim); letter-spacing:0; font-weight:400; text-transform:none; }

.chip { padding:8px 10px; border-radius:7px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#fff; font:700 11.5px 'Outfit',sans-serif; cursor:pointer; }
.chip.on, .chip.active { border-color:var(--gold); background:rgba(245,196,81,.2); color:var(--gold); }

.fb { font-size:11px; margin-top:6px; min-height:16px; font-weight:600; color:#94a3b8; }

.atr-box { right:12px; top:84px; width:min(250px,44vw); max-height:calc(100% - 150px); overflow:auto; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px; display:none; box-shadow:0 8px 30px rgba(0,0,0,.8); }
.ui-layer > .atr-box.on { display:block; }

.stat-grid .stat-label { font-size:10px; margin-right:6px; } .stat-grid .stat-val { font-size:12px; } .stat-grid .stat-bar { margin:2px 0 4px; }
.feature-badge { display:block; margin-top:4px; }
.enter-btn { right:12px; bottom:12px; padding:12px 22px; font-size:13px; letter-spacing:.08em; }
.enter-btn:hover { transform:none; }
.drag-hint { left:50%; bottom:6px; transform:translateX(-50%); pointer-events:none; white-space:nowrap; }
#canvas-wrap, #webgl { touch-action:none; }

<body>

<div id="transition-overlay"></div>

<div id="canvas-wrap">
  <canvas id="webgl"></canvas>
</div>

<div class="ui-layer">
  <div class="logo-box"><div class="logo-title"><img src="icons/is-labs.png" alt="IS" class="logo-img">IS BLADE</div><div class="logo-sub">Criar personagem</div></div>
  <a href="selecao.html" class="top-btn back">&larr; Lobby</a>

  <div class="panel" id="pn">
    <div class="tabs" role="tablist">
      <button class="tab on" data-t="classe" type="button">Classe</button>
      <button class="tab" data-t="visual" type="button">Visual</button>
      <button class="tab" data-t="nome" type="button">Nome</button>
    </div>

    <div class="pane on" id="t-classe">
      <div class="cls-grid">
        <div class="opt-card" id="cls-guerreiro" onclick="selectClasse('guerreiro')"><span class="opt-name">Guerreiro</span><span class="opt-sub">Espada longa &middot; dano</span></div>
        <div class="opt-card" id="cls-guardiao" onclick="selectClasse('guardiao')"><span class="opt-name">Guardi&atilde;o</span><span class="opt-sub">Escudo &middot; defesa</span></div>
        <div class="opt-card" id="cls-mago" onclick="selectClasse('mago')"><span class="opt-name">Mago</span><span class="opt-sub">Cajado &middot; magia</span></div>
        <div class="opt-card" id="cls-clerico" onclick="selectClasse('clerico')"><span class="opt-name">Cl&eacute;rigo</span><span class="opt-sub">Livro Astral</span></div>
      </div>
      <div id="clsInfo" class="info"></div>
    </div>

    <div class="pane" id="t-visual">
      <div class="lbl">Ra&ccedil;a <span class="gen"><button type="button" id="g-m" class="on" onclick="selectGender('m')">&#9794;</button><button type="button" id="g-f" onclick="selectGender('f')">&#9792;</button></span></div>
      <div class="chips" id="raceChips">
        <button type="button" class="chip" id="rb-human" onclick="selectBase('human')">Humano</button>
        <button type="button" class="chip" id="rb-magic" onclick="selectBase('magic')">Humano M&iacute;stico</button>
        <button type="button" class="chip" id="rb-elf" onclick="selectBase('elf')">Elfo</button>
        <button type="button" class="chip" id="rb-orc" onclick="selectBase('orc')">Orc</button>
        <button type="button" class="chip" id="rb-dwarf" onclick="selectBase('dwarf')">An&atilde;o</button>
        <button type="button" class="chip" id="rb-darkelf" onclick="selectBase('darkelf')">Elfo Negro</button>
      </div>
      <div class="lbl" style="margin-top:8px">Cabelo</div>
      <div class="chips">
        <button type="button" class="chip active" id="hair-both" onclick="selectHairStyle('both')">Padr&atilde;o</button>
        <button type="button" class="chip" id="hair-front" onclick="selectHairStyle('front')">Curto</button>
        <button type="button" class="chip" id="hair-back" onclick="selectHairStyle('back')">Longo</button>
      </div>
      <div class="color-palette">
        <div class="color-swatch active" data-color="#ffffff" style="background:#ffffff" title="Natural" onclick="selectHairColor('#ffffff')"></div>
        <div class="color-swatch" data-color="#e8c46d" style="background:#e8c46d" title="Loiro" onclick="selectHairColor('#e8c46d')"></div>
        <div class="color-swatch" data-color="#8b5a2b" style="background:#8b5a2b" title="Castanho" onclick="selectHairColor('#8b5a2b')"></div>
        <div class="color-swatch" data-color="#d2e2f5" style="background:#d2e2f5" title="Prata" onclick="selectHairColor('#d2e2f5')"></div>
        <div class="color-swatch" data-color="#ba3b2a" style="background:#ba3b2a" title="Ruivo" onclick="selectHairColor('#ba3b2a')"></div>
        <div class="color-swatch" data-color="#2b2b2b" style="background:#2b2b2b" title="Negro" onclick="selectHairColor('#2b2b2b')"></div>
        <div class="color-swatch" data-color="#38bdf8" style="background:#38bdf8" title="Azul" onclick="selectHairColor('#38bdf8')"></div>
      </div>
    </div>

    <div class="pane" id="t-nome">
      <div class="lbl">Nome do personagem <small id="nameStatusTag"></small></div>
      <input type="text" id="charName" class="name-input" value="&Iacute;caro" maxlength="16" placeholder="Digite seu nome..." autocomplete="off" autocapitalize="words" enterkeyhint="done">
      <div id="nameFeedback" class="fb">Digite o nome do seu her&oacute;i.</div>
    </div>
  </div>

  <button type="button" class="atr-btn" id="atrBtn">&#128202; Atributos &#9662;</button>
  <div class="atr-box" id="atrBox">
    <div class="lbl">Ficha <small id="lore-race-label"></small></div>
    <div class="stat-grid">
      <div><span class="stat-label">FOR</span><span class="stat-val" id="val-str">40</span><div class="stat-bar"><div class="stat-fill" id="bar-str"></div></div></div>
      <div><span class="stat-label">DES</span><span class="stat-val" id="val-dex">30</span><div class="stat-bar"><div class="stat-fill" id="bar-dex"></div></div></div>
      <div><span class="stat-label">CON</span><span class="stat-val" id="val-con">43</span><div class="stat-bar"><div class="stat-fill" id="bar-con"></div></div></div>
      <div><span class="stat-label">INT</span><span class="stat-val" id="val-int">21</span><div class="stat-bar"><div class="stat-fill" id="bar-int"></div></div></div>
      <div><span class="stat-label">SAB</span><span class="stat-val" id="val-wit">11</span><div class="stat-bar"><div class="stat-fill" id="bar-wit"></div></div></div>
      <div><span class="stat-label">ESP</span><span class="stat-val" id="val-men">25</span><div class="stat-bar"><div class="stat-fill" id="bar-men"></div></div></div>
    </div>
    <p class="lore-text" id="lore-desc"></p>
    <div id="features-container"></div>
  </div>

  <button class="enter-btn" id="enterBtn" onclick="enterWorld()"><span>Criar &amp; Entrar</span></button>
  <div class="drag-hint">Arraste para girar</div>
</div>

function createSparkleTexture(){
  var canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  var ctx = canvas.getContext('2d');
  var grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  grad.addColorStop(0.2, 'rgba(160, 220, 255, 0.9)');
  grad.addColorStop(0.5, 'rgba(80, 160, 255, 0.35)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  var tex = new THREE.CanvasTexture(canvas);
  return tex;
}

var partGeo, partMat, particles;
function setupParticles(){
  var count = 100;
  partGeo = new THREE.BufferGeometry();
  var pos = new Float32Array(count * 3);
  var vel = [];
  for(var i=0; i<count; i++){
    var theta = Math.random() * Math.PI * 2;
    var r = 0.35 + Math.random() * 1.35;
    pos[i*3] = Math.cos(theta) * r;
    pos[i*3+1] = Math.random() * 2.8;
    pos[i*3+2] = Math.sin(theta) * r;
    vel.push({ speed: 0.25 + Math.random() * 0.45, r: r, theta: theta });
  }
  partGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  partMat = new THREE.PointsMaterial({
    map: createSparkleTexture(),
    color: 0x9be0ff,
    size: 0.12,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  particles = new THREE.Points(partGeo, partMat);
  particles.userData = { vel: vel };
  scene.add(particles);
}

    var root = gltf.scene;

    var isDwarf = (currentRace === 'dwarf_f' || currentRace === 'dwarf_m');

/* ==========================================================================
   PADRAO DE ANEXACAO DE ITENS / ARMAS LINEAGE 2 (IS ONLINE)
   - Armas/Escudos exportados do L2 (.psk -> Blender -> .glb com "+Y Up" marcado)
     possuem vertices convertidos para Y-up pelo Blender, enquanto os ossos de
     soquete nativos do L2 (Weapon_R_Bone / Shield_L_Bone) operam no espaco Z-up do Unreal.
   - A rotacao canonica L2_WPN_AXIS_FIX = Math.PI / 2 (+90 graus em X) desfaz com precisao
     matematica essa conversao do Blender e devolve a malha ao alinhamento nativo do L2.
   - Itens nao-L2 (gerados no Tecxlabs 3D ou externos) podem passar { isL2: false, rotation, position, scale }.
   ========================================================================== */
var L2_WPN_AXIS_FIX = Math.PI / 2;

function attachL2Item(rootOrBone, boneNameOrParent, glbUrl, options, callback){
  var opts = options || {};
  var holder = new THREE.Group();
  if(opts.visible !== undefined) holder.visible = !!opts.visible;

  var targetBone = null;
  if(typeof boneNameOrParent === 'string'){
    var root = rootOrBone;
    var name = boneNameOrParent;
    if(root && root.getObjectByName){
      targetBone = root.getObjectByName(name);
      if(!targetBone && name === 'Weapon_R_Bone') targetBone = root.getObjectByName('Bip01_R_Hand');
      if(!targetBone && name === 'Shield_L_Bone') targetBone = root.getObjectByName('Bip01_L_Forearm');
    }
  } else if(boneNameOrParent && boneNameOrParent.isObject3D){
    targetBone = boneNameOrParent;
  } else if(rootOrBone && rootOrBone.isObject3D){
    targetBone = rootOrBone;
  }

  if(targetBone){
    targetBone.add(holder);
  }

  var loader = opts.loader || (window._l2GltfLoader = window._l2GltfLoader || new THREE.GLTFLoader());
  loader.load(glbUrl, function(gw){
    var itemScene = gw.scene;
    itemScene.traverse(function(c){
      if(c.isMesh){
        c.castShadow = true;
        c.receiveShadow = true;
        if(c.material){
          if(opts.envMapIntensity !== undefined) c.material.envMapIntensity = opts.envMapIntensity;
          else if(c.material.envMapIntensity !== undefined) c.material.envMapIntensity = 1.2;
        }
      }
    });

    if(opts.isL2 !== false){
      itemScene.rotation.set(L2_WPN_AXIS_FIX, 0, 0);
    }

    if(opts.rotation){
      if(Array.isArray(opts.rotation)) itemScene.rotation.set(opts.rotation[0], opts.rotation[1], opts.rotation[2]);
      else if(opts.rotation.isEuler) itemScene.rotation.copy(opts.rotation);
    }
    if(opts.position){
      if(Array.isArray(opts.position)) itemScene.position.set(opts.position[0], opts.position[1], opts.position[2]);
      else if(opts.position.isVector3) itemScene.position.copy(opts.position);
    }
    if(opts.scale !== undefined){
      if(typeof opts.scale === 'number') itemScene.scale.setScalar(opts.scale);
      else if(Array.isArray(opts.scale)) itemScene.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
    }

    holder.add(itemScene);
    if(callback) callback(holder, itemScene, gw);
  }, undefined, function(err){
    console.error('[attachL2Item] Falha ao carregar item:', glbUrl, err);
    if(opts.fallbackUrl){
      attachL2Item(holder, null, opts.fallbackUrl, {
        isL2: opts.fallbackIsL2 !== undefined ? opts.fallbackIsL2 : true,
        loader: loader
      });
    }
  });

  return holder;
}

function attachWeapon(){
  if(!currentModel) return;
  var wpBone = currentModel.getObjectByName('Weapon_R_Bone') || currentModel.getObjectByName('Bip01_R_Hand');
  var shdBone = currentModel.getObjectByName('Shield_L_Bone') || currentModel.getObjectByName('Bip01_L_Forearm');

  if(weaponObj && wpBone){
    wpBone.remove(weaponObj);
    weaponObj = null;
  }
  if(shieldObj && shdBone){
    shdBone.remove(shieldObj);
    shieldObj = null;
  }

  if(staffObj && staffObj.parent) staffObj.parent.remove(staffObj); staffObj = null;
  if(currentWeapon === 'staff' && wpBone){
    staffObj = makeStaff(); wpBone.add(staffObj);
  } else if(currentWeapon === 'book' && shdBone){/* [clerigo] cajado na mao direita (os mesmos do mago) + Livro Astral aberto na esquerda */
    staffObj = makeBook(); shdBone.add(staffObj);
    if(wpBone){ weaponObj = makeStaff(); wpBone.add(weaponObj); }
  } else if((currentWeapon === 'sword' || currentWeapon === 'dragon_slayer') && wpBone){
    weaponObj = attachL2Item(wpBone, null, 'assets/personagens/twohanded_sword.glb');
  } else if(currentWeapon === 'shield'){
    /* Guardiao: joga apenas com escudo (Round Shield inicial), NUNCA espada */
    if(shdBone){
      shieldObj = attachL2Item(shdBone, null, 'assets/personagens/round_shield.glb');
    }
  }
}

function makeStaff(){

/* [clerigo] Livro Astral (mesmo desenho do jogo: js/clerigo_fx.js -> ClerigoFX.livro), em unidades do osso */
function makeBook(){
  var g = new THREE.Group(), L = 4.6, W = .32, H = 7, capa = new THREE.MeshStandardMaterial({ color: 0x1c2c48, roughness: .6 }), ouro = new THREE.MeshStandardMaterial({ color: 0xd9b25a, roughness: .35, metalness: .8, emissive: 0x3a2a08 }), pag = new THREE.MeshBasicMaterial({ color: 0xfff0c4 });
  function cx(m, w, h, d, x, z){ var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, 0, z); return o; }
  g.add(cx(capa, W * 1.6, H, W * 2, 0, 0));
  [-1, 1].forEach(function(l){ var pv = new THREE.Group(); pv.rotation.y = l * (Math.PI / 2 - .87); g.add(pv); pv.add(cx(capa, L, H, W, l * L / 2, 0)); pv.add(cx(ouro, L * .96, H * 1.02, W * .6, l * L / 2, -W * .7)); pv.add(cx(pag, L * .88, H * .9, W * .5, l * (L / 2 + .2), W * 1.05)); });
  g.position.set(0, 3, 2.5); g.rotation.set(0, Math.PI / 2, 0);
  return g;
}
var currentAction = null;
window.playAction = function(name){
  if(currentWeapon === 'none'){
    if(name === 'idle') name = 'idle_hand';
    else if(name === 'run') name = 'run_hand';
    else if(name === 'walk') name = 'walk_hand';
    else if(name === 'slash1' || name === 'slash2' || name === 'slash4') name = 'punch';
  }
  if(!mixer || !clips[name]) return;
  var clip = clips[name];
  var act = mixer.clipAction(clip);
  if(currentAction && currentAction !== act){
    currentAction.fadeOut(0.2);
  }
  act.reset();
  var isLoop = (name === 'idle' || name === 'idle_hand' || name === 'run' || name === 'run_hand' || name === 'walk' || name === 'walk_hand' || name === 'guard');
  act.setLoop(isLoop ? THREE.LoopRepeat : THREE.LoopOnce);
  act.clampWhenFinished = !isLoop;
  act.fadeIn(0.2);
  act.play();
  currentAction = act;

  // Play matching L2 SFX
  try {
    if(name === 'slash1' || name === 'slash2' || name === 'punch'){
      sfxSwing.currentTime = 0; sfxSwing.play().catch(function(){});
    } else if(name === 'slash4'){
      sfxPower.currentTime = 0; sfxPower.play().catch(function(){});
    } else if(name === 'roll'){
      sfxDash.currentTime = 0; sfxDash.play().catch(function(){});
    }
  } catch(_){}

  // If oneshot, return to idle
  if(!isLoop){
    var dur = clip.duration / act.timeScale;
    setTimeout(function(){
      if(currentAction === act) playAction(currentWeapon === 'none' ? 'idle_hand' : 'idle');
    }, dur * 1000 - 150);
  }

  // Update UI buttons
  document.querySelectorAll('.anim-btn').forEach(function(b){
    b.classList.remove('active');
    var oc = b.getAttribute('onclick') || '';
    if(oc.includes("'" + name + "'") || (name === 'idle_hand' && oc.includes("'idle'")) || (name === 'run_hand' && oc.includes("'run'")) || (name === 'punch' && oc.includes("'slash1'"))){
      b.classList.add('active');
    }
  });
};

window.updateAttributesUI = function(rData){
  if(!rData) return;
  var s = rData.stats;
  // Stats
  var maxStat = 50;
  var keys = ['str', 'dex', 'con', 'int', 'wit', 'men'];
  keys.forEach(function(k){
    var v = s[k] || 10;
    var elVal = document.getElementById('val-' + k);
    var elBar = document.getElementById('bar-' + k);
    if(elVal) elVal.textContent = v;
    if(elBar) elBar.style.width = Math.min(100, Math.round((v / maxStat) * 100)) + '%';
  });

  // Lore
  var loreLbl = document.getElementById('lore-race-label');
  if(loreLbl) loreLbl.innerHTML = rData.deity || 'Aden';
  var loreDesc = document.getElementById('lore-desc');
  if(loreDesc) loreDesc.textContent = rData.lore || '';

  // Features
  var fWrap = document.getElementById('features-container');
  if(fWrap && rData.features){
    fWrap.innerHTML = rData.features.map(function(f){
      return '<div class="feature-badge">' + f + '</div>';
    }).join('');
  }
};

window.selectRace = function(r){
  if(!RACE_DATA[r]) return;
  currentRace = r;
  try { localStorage.setItem('isblade.char_race', r); } catch(_){}

  var base = r.replace(/_(m|f)$/, '').replace(/_female$/, ''); if(r === 'human_fighter') base = 'human'; else if(r === 'human_fighter_female') base = 'human';
  currentBase = base; currentGender = /(_f|_female)$/.test(r) ? 'f' : 'm';
  document.querySelectorAll('#raceChips .chip').forEach(function(c){ c.classList.toggle('active', c.id === 'rb-' + base); });
  var gm = document.getElementById('g-m'), gf = document.getElementById('g-f');
  if(gm) gm.classList.toggle('on', currentGender === 'm'); if(gf) gf.classList.toggle('on', currentGender === 'f');

  var rData = RACE_DATA[r];
  window.updateAttributesUI(rData);

  // Load appropriate model
  loadModel(rData.model);
};

var RACA_IDS = { human: ['human_fighter', 'human_fighter_female'], magic: ['magic_m', 'magic_f'], elf: ['elf_m', 'elf_f'], orc: ['orc_m', 'orc_f'], dwarf: ['dwarf_m', 'dwarf_f'], darkelf: ['darkelf_m', 'darkelf_f'] };
var currentBase = 'human', currentGender = 'm';
window.selectBase = function(base){ var ids = RACA_IDS[base]; if(ids) selectRace(ids[currentGender === 'f' ? 1 : 0]); };
window.selectGender = function(g){ currentGender = g; var ids = RACA_IDS[currentBase]; if(ids) selectRace(ids[g === 'f' ? 1 : 0]); };

/* abas, atributos recolhidos e modo teclado (so campo do nome + Criar ficam visiveis) */
window.showTab = function(t){
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on', p.id === 't-' + t); });
};
function setupAbas(){
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ showTab(b.getAttribute('data-t')); }); });
  var ab = document.getElementById('atrBtn'), bx = document.getElementById('atrBox');
  if(ab && bx) ab.addEventListener('click', function(){ var on = bx.classList.toggle('on'); ab.innerHTML = '&#128202; Atributos ' + (on ? '&#9652;' : '&#9662;'); });
  var nm = document.getElementById('charName');
  if(nm){
    nm.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); nm.blur(); } });
  }
}

var currentHairStyle = 'both';
var currentHairColor = '#ffffff';

function applyHair(root, style, colorHex){
  if(!root) return;
  root.traverse(function(child){
    if(child.isMesh){
      var n = (child.name || '').toLowerCase();
      var isFront = n.indexOf('hair_front') !== -1 || n.indexOf('_ah') !== -1;
      var isBack = n.indexOf('hair_back') !== -1 || n.indexOf('_bh') !== -1;
      if(isFront || isBack){
        if(isFront && !isBack){
          child.visible = (style === 'both' || style === 'front');
        } else if(isBack && !isFront){
          child.visible = (style === 'both' || style === 'back');
        }
        if(child.material){
          var mList = Array.isArray(child.material) ? child.material : [child.material];
          mList.forEach(function(m){
            if(colorHex && colorHex !== '#ffffff'){
              m.color.setStyle(colorHex);
              if(m.emissive){
                var tc = new THREE.Color(colorHex);
                m.emissive.copy(tc).multiplyScalar(0.32);
              }
            } else {
              m.color.setHex(0xffffff);
              if(m.emissive) m.emissive.setHex(0x000000);
            }
            m.needsUpdate = true;
          });
        }
      }
    }
  });
}

window.selectHairStyle = function(style){
  currentHairStyle = style;
  var bEl = document.getElementById('hair-both');
  var fEl = document.getElementById('hair-front');
  var bkEl = document.getElementById('hair-back');
  if(bEl) bEl.classList.toggle('active', style === 'both');
  if(fEl) fEl.classList.toggle('active', style === 'front');
  if(bkEl) bkEl.classList.toggle('active', style === 'back');
  applyHair(currentModel, currentHairStyle, currentHairColor);
};

window.selectHairColor = function(hex){
  currentHairColor = hex;
  document.querySelectorAll('.color-swatch').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-color') === hex);
  });
  applyHair(currentModel, currentHairStyle, currentHairColor);
};

var CLASSES = {
  guardiao:  { nome: 'Guardião',  wpn: 'shield',        save: 'shield', papel: 'Defensor: segura o inimigo e protege o grupo.' },
  mago:      { nome: 'Mago',          wpn: 'staff',         save: 'staff',  papel: 'Dano mágico à distância com habilidades de área.' },
  guerreiro: { nome: 'Guerreiro',     wpn: 'sword',         save: 'sword',  papel: 'Dano físico corpo a corpo, combos rápidos.' },
  clerico:   { nome: 'Clérigo',       wpn: 'book',          save: 'book',   papel: 'Suporte: cura os aliados e fere com luz (Livro Astral).' }/* [clerigo] 10/11 */
};
var currentClasse = 'guerreiro';
window.selectClasse = function(id){
  var c = CLASSES[id];
  if(!c){ var inf0 = document.getElementById('clsInfo'); if(inf0) inf0.textContent = 'O Clérigo (Livro Astral) ainda não está disponível.'; return; }
  currentClasse = id;
  currentWeapon = c.wpn;
  try { localStorage.setItem('isblade.weapon', c.save); } catch(_){}
  Object.keys(CLASSES).concat(['clerico']).forEach(function(k){
    var el = document.getElementById('cls-' + k); if(el) el.classList.toggle('active', k === id);
  });
  var inf = document.getElementById('clsInfo'); if(inf) inf.textContent = c.papel;
  attachWeapon();
  playAction('idle');
};
window.selectWeapon = function(wpn){ selectClasse(wpn === 'shield' ? 'guardiao' : 'guerreiro'); };


window.selectDest = function(dest){
  currentDest = dest;
  document.getElementById('dest-cidade').classList.toggle('active', dest === 'cidade');
  document.getElementById('dest-arena').classList.toggle('active', dest === 'arena');
};

function getExistingNames(){
  try {
    var raw = localStorage.getItem('isblade_characters');
    if(raw){
      var arr = JSON.parse(raw);
      return arr.map(function(c){ return (c.name || '').trim().toLowerCase(); });
    }
  } catch(_){}
  return [];
}

function checkNameAvailability(name){
  var clean = (name || '').trim();
  if(!clean) return { valid: false, msg: '⚠️ Digite o nome do seu herói.', color: '#94a3b8' };
  if(clean.length < 2) return { valid: false, msg: '⚠️ Nome muito curto (mínimo 2 letras).', color: '#f59e0b' };
  var existing = getExistingNames();
  if(existing.indexOf(clean.toLowerCase()) !== -1){
    return { valid: false, msg: '❌ O nome "' + clean + '" já existe! Escolha outro nome.', color: '#ef4444' };
  }
  return { valid: true, msg: '✨ Nome "' + clean + '" está livre no Reino de Aden!', color: '#22c55e' };
}

function setupNameValidation(){
  var nameEl = document.getElementById('charName');
  var fbEl = document.getElementById('nameFeedback');
  if(!nameEl || !fbEl) return;

  var existing = getExistingNames();
  var defaultName = 'Ícaro';
  if(existing.indexOf(defaultName.toLowerCase()) !== -1){
    var n = 2;
    while(existing.indexOf((defaultName + ' ' + n).toLowerCase()) !== -1){ n++; }
    defaultName = defaultName + ' ' + n;
  }
  nameEl.value = defaultName;

  function updateStatus(){
    var val = nameEl.value.trim();
    var res = checkNameAvailability(val);
    fbEl.textContent = res.msg;
    fbEl.style.color = res.color;
    if(!res.valid && val){
      nameEl.style.borderColor = res.color;
      nameEl.style.boxShadow = '0 0 10px ' + (res.color === '#ef4444' ? 'rgba(239, 68, 68, 0.45)' : 'rgba(245, 158, 11, 0.35)');
    } else if(res.valid){
      nameEl.style.borderColor = '#22c55e';
      nameEl.style.boxShadow = '0 0 10px rgba(34, 197, 94, 0.35)';
    } else {
      nameEl.style.borderColor = 'rgba(90, 169, 255, 0.35)';
      nameEl.style.boxShadow = 'none';
    }
    return res.valid;
  }

  nameEl.addEventListener('input', updateStatus);
  nameEl.addEventListener('blur', updateStatus);
  updateStatus();
}


window.enterWorld = function(){
  var nameEl = document.getElementById('charName');
  var pName = (nameEl && nameEl.value.trim()) || '';
  var nameCheck = checkNameAvailability(pName);
  if(!nameCheck.valid){
    if(window.showTab) showTab('nome');
    if(nameEl) nameEl.focus();
    else alert(nameCheck.msg);
    return;
  }

  var saveType = currentRace;
  var saveWpn = CLASSES[currentClasse].save;

  /* MMO: quem cria o personagem e o SERVIDOR (nome unico, limite de slots); aqui so se pede e se guarda a copia devolvida */
  if(window._criando) return; window._criando = true;
  var corpoCria = { name: pName, race: currentRace, charType: saveType, set: 'fighter', weapon: saveWpn, classe: currentClasse, hairStyle: currentHairStyle, hairColor: currentHairColor };
  Conta.api('POST', '/api/personagens', corpoCria, function(cod, j){
    window._criando = false;
    if(cod !== 200 || !j || !j.char){
      alert((j && j.erro) || (cod === 401 ? 'Sua sessão expirou. Entre na conta de novo.' : 'Não consegui falar com o servidor. Tente de novo.'));
      if(cod === 401) location.replace('login.html');
      return;
    }
    var newChar = j.char, newCharId = newChar.id;
    try {
      localStorage.setItem('isblade_active_character_id', newCharId);
      // Chaves de compatibilidade legado
      localStorage.setItem('isblade.player_name', newChar.name);
      localStorage.setItem('isblade.char_type', newChar.charType);
      localStorage.setItem('isblade.char_race', newChar.race);
      localStorage.setItem('isblade.weapon', newChar.weapon);
      localStorage.setItem('isblade.hair_style', newChar.hairStyle);
      localStorage.setItem('isblade.hair_color', newChar.hairColor);
    } catch(_){}
    irParaMundo();
  });
};
function irParaMundo(){
  try {
    sfxEnter.currentTime = 0;
    sfxEnter.play().catch(function(){});
  } catch(_){}

  var targetUrl = 'cidade.html';
  var overlay = document.getElementById('transition-overlay');
  overlay.style.opacity = '1';
  setTimeout(function(){
    window.location.href = targetUrl;
  }, 600);
}

// Mouse drag to rotate pedestal & zoom
var isDragging = false, prevX = 0, prevY = 0;
function setupControls(){
  window.addEventListener('pointerdown', function(e){
    if(e.target.closest('.panel') || e.target.closest('.atr-box') || e.target.closest('button') || e.target.closest('a')) return;
    isDragging = true; prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('pointermove', function(e){
    if(!isDragging || !pedestalGroup) return;
    pedestalGroup.rotation.y += (e.clientX - prevX) * 0.008;
    prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('pointerup', function(){ isDragging = false; });
  window.addEventListener('pointercancel', function(){ isDragging = false; });
  window.addEventListener('wheel', function(e){
    camera.position.z = Math.max(2.5, Math.min(6.5, camera.position.z + e.deltaY * 0.003));
  }, { passive:true });
}

/* enquadramento: tela larga e baixa (celular deitado) afasta a camera para o personagem aparecer inteiro */
function enquadra(){
  var larga = innerWidth / Math.max(1, innerHeight) > 1.5;
  camera.position.set(0, larga ? 1.05 : 1.4, larga ? 5.2 : 4.2);
}
function onResize(){
  enquadra();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

var guardW = 0;
var L2_GUARD_ROT = new THREE.Euler(-0.35, 1.57, -1.25, 'XYZ');
var L2_GUARD_POS = new THREE.Vector3(-0.15, 0.35, 0.25);

function animate(){
  requestAnimationFrame(animate);
  var dt = clock.getDelta();

  if(mixer) mixer.update(dt);

  // Smooth blade guard posture (flat broadside facing enemy)
  var curClip = currentAction ? currentAction.getClip() : null;
  var wantGuard = (curClip && (curClip.name === 'guard' || curClip.name === 'AtkWait_2HS_MFighter') && currentWeapon === 'dragon_slayer') ? 1 : 0;
  guardW = Math.max(0, Math.min(1, guardW + (wantGuard ? 1 : -1) * dt / 0.12));
  var gwVal = guardW * guardW * (3 - 2 * guardW);
  if(weaponObj){
    if(gwVal > 0.0005){
      weaponObj.rotation.set(L2_GUARD_ROT.x * gwVal, L2_GUARD_ROT.y * gwVal, L2_GUARD_ROT.z * gwVal);
      weaponObj.position.set(L2_GUARD_POS.x * gwVal, L2_GUARD_POS.y * gwVal, L2_GUARD_POS.z * gwVal);
    } else if(weaponObj.rotation.x !== 0 || weaponObj.position.x !== 0){
      weaponObj.rotation.set(0, 0, 0);
      weaponObj.position.set(0, 0, 0);
    }
  }

  // Soft idle pedestal rotation when not dragging
  if(!isDragging && pedestalGroup){
    pedestalGroup.rotation.y += dt * 0.15;
  }

  // Update particles
  if(particles && partGeo){
    var pos = partGeo.attributes.position.array;
    var vel = particles.userData.vel;
    for(var i=0; i<vel.length; i++){
      pos[i*3+1] += vel[i].speed * dt;
      if(pos[i*3+1] > 2.8) pos[i*3+1] = 0.05;
      vel[i].theta += dt * 0.4;
      pos[i*3] = Math.cos(vel[i].theta) * vel[i].r;
      pos[i*3+2] = Math.sin(vel[i].theta) * vel[i].r;
    }
    partGeo.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
}

window.addEventListener('DOMContentLoaded', init);
