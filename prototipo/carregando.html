<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carregando — IS BLADE</title>
<meta name="theme-color" content="#06070d">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Sora:wght@200;300;400;600;800&display=swap">
<link rel="stylesheet" href="css/portal.css?v=4">
<style>
  body{background-image:linear-gradient(rgba(6,7,13,.78),rgba(6,7,13,.9)),url('assets/talking_island/loading_screen.jpg');background-size:cover;background-position:center}
  .box{width:min(640px,100%)}
  .dica{min-height:150px;margin:30px 0 26px;display:flex;flex-direction:column;justify-content:center;transition:opacity .45s}
  .dica small{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;font-weight:600}
  .dica p{margin-top:10px;font-size:clamp(17px,3.6vw,24px);color:var(--ink);font-weight:300;line-height:1.5}
  .trilho{height:14px;border-radius:999px;background:#0b0d17;border:1px solid var(--edge);overflow:hidden;box-shadow:0 0 30px rgba(61,143,214,.15)}
  .trilho i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--azul),var(--azul-2),var(--gold-2));transition:width .25s}
  .info{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
  .pula{margin-top:22px;font-size:12px;color:var(--ink-3);display:none}.pula a{border-bottom:1px solid var(--edge)}
</style>
</head>
<body>
<main class="centro">
  <img class="logo p" src="icons/is-labs.png" alt="IS Labs">
  <h1 style="font-size:clamp(34px,8vw,62px);margin:10px 0 0">IS BLADE</h1>
  <div class="box">
    <div class="dica" id="dica"><small id="dn">Dica 1</small><p id="dt"></p></div>
    <div class="trilho"><i id="barra"></i></div>
    <div class="info"><span id="etapa">Preparando…</span><span><span id="info2"></span> &nbsp; <span id="pct">0%</span></span></div>
    <p class="pula" id="pula">Demorando? <a href="selecao.html">Entrar mesmo assim</a> (o resto carrega durante o jogo) &nbsp;·&nbsp; <a href="#" id="limpa">Limpar o cache do jogo e tentar de novo</a><br><small id="diag"></small></p>
  </div>
</main>
<script src="js/conta.js?v=4"></script>
<script>
(function(){
  if(!Conta.logado() && !Conta.convidado()){ location.replace('login.html'); return; }
  Conta.liberaFluxo();                                                /* a partir daqui esta aba pode abrir lobby, cidade e arena */
  var DICAS = [
    'Um toque no Shift é uma ESQUIVA. Continue segurando para CORRER; correr gasta estamina aos poucos.',
    'Esquive no instante do golpe do inimigo: a ESQUIVA PERFEITA devolve estamina.',
    'Segure C para bloquear. Com estamina o bloqueio é forte; sem ela, fraco.',
    'Abra a árvore de skills (S) e arraste cada skill para o slot que quiser. Em Opções (O) você escolhe a tecla de cada slot.',
    'A Fortaleza Égide do Guardião é uma cúpula que gira, machuca quem está dentro e ainda cura você.',
    'A Corrente de Puxão traz os inimigos comuns até você. Chefes nunca são puxados.',
    'Nas dungeons o relógio corre: derrube a meta de inimigos e o chefe antes do tempo acabar. Se acabar, você é expulso.',
    'Vença a DG Hard no 2º andar da torre: a porta do Baium, no 3º andar, se abre sozinha.',
    'Na cidade, chegue perto do portal e aperte E para escolher entre Dungeon, Duelo contra o Baium ou PvP.',
    'Cada personagem tem inventário, skills e maestria próprios. Crie mais de um e experimente estilos diferentes.',
    'Pule com Espaço para subir degraus altos e escapar de ataques de área.',
    'Aperte P para abrir o menu: desafie alguém para um duelo sem risco de morte ou convide amigos para o seu grupo.',
    'Troque de arma com X, mas só fora de combate.',
    'No celular, jogue com o aparelho deitado e arraste o dedo no lado esquerdo da tela para andar.',
    'Sua conta guarda tudo: entre de qualquer aparelho para continuar de onde parou.'
  ];
  var q = function(id){ return document.getElementById(id); }, di = Math.floor(Math.random() * DICAS.length);
  function dica(){ var d = q('dica'); d.style.opacity = 0; setTimeout(function(){ q('dn').textContent = 'Dica ' + (di % DICAS.length + 1) + ' de ' + DICAS.length; q('dt').textContent = DICAS[di % DICAS.length]; di++; d.style.opacity = 1; }, 450); }
  q('dn').textContent = 'Dica ' + (di + 1) + ' de ' + DICAS.length; q('dt').textContent = DICAS[di++ % DICAS.length]; setInterval(dica, 5500);
  setTimeout(function(){ q('pula').style.display = 'block'; }, 10000);
  q('limpa').onclick = function(e){ e.preventDefault(); q('diag').textContent = 'Limpando…';      /* so o cache do aplicativo; seus personagens e a conta ficam */
    var fs = []; try { if(navigator.serviceWorker) fs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch(x){}
    try { if(window.caches) fs.push(caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf('is-') === 0; }).map(function(k){ return caches.delete(k); })); })); } catch(x){}
    Promise.all(fs).catch(function(){}).then(function(){ location.reload(); }); };
  /* vigia: sem nenhum byte novo por 30 s, segue para o lobby (o resto carrega durante o jogo) em vez de ficar parado */
  var visto = -1, parado = 0;
  setInterval(function(){ if(fim) return; if(feito === visto){ parado += 1; q('diag').textContent = 'Sem progresso ha ' + parado * 5 + ' s…'; if(parado >= 6){ terminou(); } } else { visto = feito; parado = 0; q('diag').textContent = ''; } }, 5000);

  var ETAPAS = [['personagens', 'Preparando seus personagens…'], ['talking_island', 'Montando a Ilha de Talking…'], ['baium', 'Acordando o Baium…'], ['fx', 'Acendendo os efeitos…'], ['audio', 'Afinando os sons…'], ['l2_sounds', 'Afinando os sons…'], ['hud', 'Desenhando a interface…'], ['cenario', 'Erguendo as muralhas…']];
  function etapa(u){ for(var i = 0; i < ETAPAS.length; i++) if(u.indexOf('/' + ETAPAS[i][0]) >= 0) return ETAPAS[i][1]; return 'Baixando recursos do jogo…'; }
  var t0 = Date.now(), feito = 0, total = 1, fim = false;
  var pull = Conta.puxar();                                           /* traz os personagens da conta enquanto baixa os arquivos */
  function pinta(){ var p = Math.min(100, Math.round(feito / total * 100)); q('barra').style.width = p + '%'; q('pct').textContent = p + '%'; }
  function terminou(){
    if(fim) return; fim = true; feito = total; pinta(); q('etapa').textContent = 'Tudo pronto! Entrando no lobby…';
    pull.then(function(){ setTimeout(function(){ location.href = 'selecao.html'; }, Math.max(700, 3200 - (Date.now() - t0))); });       /* mostra pelo menos 3 s: da tempo de ler uma dica */
  }
  var baixado = 0, mbTot = 0;
  function mb(b){ return (b / 1e6).toFixed(b < 1e7 ? 1 : 0); }
  var cj = ('AbortController' in window) ? new AbortController() : null, tj = setTimeout(function(){ if(cj) cj.abort(); }, 8000);          /* lista de arquivos: 8 s ou segue sem pre-carga */
  fetch('assets/precarga.json', { cache: 'no-cache', signal: cj ? cj.signal : undefined }).then(function(r){ clearTimeout(tj); return r.json(); }).then(function(L){
    var itens = (L.itens || []).filter(function(i){ return i.e !== 0; });                 /* so o essencial (lobby e cidade); Baium e arena baixam quando forem usados */
    total = Math.max(1, itens.reduce(function(a, i){ return a + i.b; }, 0)); mbTot = total; var idx = 0, vivos = 0;
    function soma(n){ baixado += n; feito = baixado; pinta(); q('info2').textContent = mb(Math.min(baixado, mbTot)) + ' de ' + mb(mbTot) + ' MB'; }
    function proximo(){
      if(idx >= itens.length){ if(vivos === 0) terminou(); return; }
      var it = itens[idx++], contou = 0; vivos++; q('etapa').textContent = etapa(it.u);
      function fimItem(){ if(contou < it.b) soma(it.b - contou); vivos--; proximo(); }
      var ctl = ('AbortController' in window) ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 90000);       /* arquivo parado 90 s: pula (carrega depois no jogo) */
      fetch(it.u, ctl ? { signal: ctl.signal } : {}).then(function(r){
        if(!r.body || !r.body.getReader) return r.arrayBuffer();
        var rd = r.body.getReader();
        return (function le(){ return rd.read().then(function(x){ if(x.done) return; contou += x.value.length; soma(x.value.length); return le(); }); })();      /* a barra anda enquanto o arquivo desce */
      }).catch(function(){}).then(function(){ clearTimeout(to); fimItem(); });
    }
    for(var k = 0; k < 4; k++) proximo();                             /* 4 downloads ao mesmo tempo; o service worker guarda cada arquivo para as proximas vezes */
  }).catch(function(){ terminou(); });
})();
</script>
</body>
</html>
