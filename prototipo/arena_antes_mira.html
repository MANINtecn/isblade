<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IS BLADE - Arena (Three.js moderno)</title>
<style>
:root{--bg:#05060d;--sys:#5aa9ff;--sys2:#8b7bff;--red:#ff4d6d;--gold:#f5c451;--vio:#b79cff;--ink:#e8f0ff;--dim:#7f8db0;--panel:rgba(8,14,30,.82);--line:rgba(90,169,255,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#scene,#gest{position:fixed;inset:0;width:100%;height:100%;display:block}
#gest{touch-action:none;z-index:2}
.ui{position:fixed;z-index:3;pointer-events:none}
#top{left:16px;top:12px;width:min(340px,50vw)}
#brand{font-weight:800;letter-spacing:.18em;font-size:15px}
#brand span{font-weight:500;letter-spacing:.04em;color:var(--dim);font-size:11px;margin-left:6px}
.bar{position:relative;height:14px;margin-top:8px;border:1px solid var(--line);background:rgba(5,10,24,.7);border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
#ehpfill{background:linear-gradient(90deg,#b3123a,var(--red))}
#xpfill{background:linear-gradient(90deg,#3b6fe0,var(--sys2));width:0}
.bar b{position:absolute;inset:0;text-align:center;font-size:10px;line-height:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000}
#estate{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;min-height:16px}
#hunter{margin-top:6px;font-size:11px;color:var(--dim)}
#hunter strong{color:var(--sys);font-size:12px}
#pbars{left:16px;bottom:104px;width:min(300px,52vw)}
#phpfill{background:linear-gradient(90deg,#1f9d57,#58e08e)}
#stfill{background:linear-gradient(90deg,#b8860b,var(--gold))}
#focus{margin-top:6px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.14em;min-height:16px}
#chain{left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;min-height:42px}
.chip{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:4px;display:flex;align-items:center;justify-content:center;animation:pop .18s}
.chip.skill{border-color:var(--gold);box-shadow:0 0 10px rgba(245,196,81,.5)}
.chip.secret{border-color:var(--vio);box-shadow:0 0 12px rgba(183,156,255,.7)}
@keyframes pop{from{transform:scale(1.4);opacity:.3}to{transform:none;opacity:1}}
#winbar{left:50%;top:58px;transform:translateX(-50%);width:min(240px,40vw);height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#winbar div{height:100%;width:0;background:var(--sys)}
#hits{left:50%;top:68px;transform:translateX(-50%);font-size:12px;color:var(--dim);letter-spacing:.1em}
#banner{left:50%;top:26%;transform:translate(-50%,0);text-align:center;opacity:0}
#banner .t{font-size:clamp(20px,4.4vw,40px);font-weight:800;letter-spacing:.12em;text-shadow:0 0 18px currentColor}
#banner .s{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
#banner.show{animation:ban 1.5s ease-out}
@keyframes ban{0%{opacity:0;transform:translate(-50%,10px) scale(1.25)}12%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#msg{left:50%;bottom:112px;transform:translateX(-50%);font-size:13px;color:var(--dim);text-align:center;transition:opacity .3s;width:90vw}
#sysmsg{left:50%;top:44%;transform:translateX(-50%);width:min(360px,86vw);border:1px solid var(--sys);background:var(--panel);box-shadow:0 0 24px rgba(90,169,255,.35);padding:14px 16px;text-align:center;opacity:0}
#sysmsg.show{animation:sys 2.6s ease-out}
#sysmsg h4{font-size:11px;letter-spacing:.3em;color:var(--sys);margin-bottom:6px}
#sysmsg p{font-size:14px}
@keyframes sys{0%{opacity:0;transform:translateX(-50%) scaleY(.2)}10%{opacity:1;transform:translateX(-50%) scaleY(1)}85%{opacity:1}100%{opacity:0}}
#hurt{inset:0;background:radial-gradient(ellipse at center,rgba(255,40,70,0) 50%,rgba(255,40,70,.6) 100%);opacity:0;transition:opacity .35s}
#hurt.on{opacity:1;transition:none}
#panel{right:12px;top:12px;width:min(270px,44vw);max-height:calc(100vh - 330px);overflow:auto;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:12px}
#panel h3{font-size:10px;letter-spacing:.25em;color:var(--sys);margin:2px 0 8px;font-weight:700}
#panel .tg{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#panel button{pointer-events:auto;cursor:pointer;font:inherit;font-size:11px;color:var(--ink);background:rgba(90,169,255,.08);border:1px solid var(--line);border-radius:3px;padding:3px 8px}
#panel button.on{background:rgba(90,169,255,.28);border-color:var(--sys)}
.opt{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(90,169,255,.12)}
.opt .k{margin-left:auto;font-weight:700;color:var(--sys);border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:11px}
.opt small{display:block;color:var(--gold);font-size:10px}
.opt.sec small{color:var(--vio)}
.combo{padding:5px 0;border-bottom:1px solid rgba(90,169,255,.12)}
.combo .n{font-weight:600}
.combo .n.sec{color:var(--vio)}
.combo .seq{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.mini{width:24px;height:24px;border:1px solid var(--line);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:rgba(5,10,24,.6)}
#pad{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#pad button{pointer-events:auto;cursor:pointer;width:clamp(40px,9vw,58px);padding:6px 2px 4px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;font:inherit;text-align:center;touch-action:none}
#pad button:active{background:rgba(90,169,255,.3)}
#pad button span{display:block;font-size:10px;color:var(--dim);margin-top:2px}
#pad button b{color:var(--sys);font-size:11px}
#pad button.act{width:clamp(54px,12vw,74px);font-weight:700;font-size:12px;display:flex;flex-direction:column;justify-content:center}
#pad button.act b{color:var(--gold);font-size:10px;margin-top:3px}
#pad button.act.g{border-color:var(--sys)}
#skills{right:14px;bottom:100px;display:grid;grid-template-columns:repeat(3,auto);gap:8px;pointer-events:auto}
#skills button{pointer-events:auto;position:relative;overflow:hidden;width:clamp(62px,14vw,78px);height:clamp(62px,14vw,78px);border-radius:12px;border:1px solid var(--sys);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#skills button:active{background:rgba(90,169,255,.3)}
#skills strong{font-size:10px;font-weight:600;text-align:center;line-height:1.1;padding:0 3px}
#skills b{font-size:12px;color:var(--gold)}
#skills em{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(2,4,10,.78)}
#skills u{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;text-decoration:none}
#skills button.rdy{box-shadow:0 0 10px rgba(90,169,255,.35)}
#floats{inset:0}
.fl{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:20px;text-shadow:0 2px 6px #000;animation:fl .95s ease-out forwards;pointer-events:none;z-index:3;white-space:nowrap}
@keyframes fl{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-70px;scale:1}}
svg{display:block}
@media (max-width:640px){#panel{width:44vw;font-size:11px}#pad{gap:4px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="gest"></canvas>

<div id="hurt" class="ui"></div>
<div id="top" class="ui">
  <div id="brand">IS BLADE<span>arena de combate 3D</span></div>
  <div class="bar"><i id="ehpfill"></i><b id="ehptxt"></b></div>
  <div id="estate"></div>
  <div class="bar" style="height:8px"><i id="xpfill"></i></div>
  <div id="hunter"></div>
</div>
<div id="chain" class="ui"></div>
<div id="winbar" class="ui"><div></div></div>
<div id="hits" class="ui"></div>
<div id="banner" class="ui"><div class="t"></div><div class="s"></div></div>
<div id="sysmsg" class="ui"><h4>SISTEMA</h4><p></p></div>
<div id="msg" class="ui">Clique: andar &middot; segurar o clique: ataque basico &middot; botao direito (segure): camera &middot; Espaco: bloquear/parry &middot; Shift: esquivar &middot; Q E R F T: skills &middot; 1 a 6: golpes</div>

  <div class="bar"><i id="phpfill"></i><b id="phptxt"></b></div>
  <div class="bar" style="height:10px"><i id="stfill"></i></div>

</div>

  <div class="tg">
    <button id="tGuia" class="on">Guia</button>
    <button id="tSec" class="on">Revelar secretos</button>
  </div>
  <h3 id="hNext">PROXIMO GOLPE</h3>
  <div id="next"></div>

<script type="module">
import * as THREE from './lib/vendor.js';
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var lerp=function(a,b,t){return a+(b-a)*t};
var dist=function(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])};
function fwd(a){return [Math.sin(a),Math.cos(a)];}
function angDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a));}

/* ---------------- constantes de combate ---------------- */
var STROKE_COST=8,ROLL_COST=22,ROLL_DUR=.4,ROLL_DIST=4.6,IFR_A=.04,IFR_B=.30;
var PARRY_W=.2,ARENA=13.5,REACH=3.6,RUN=5.6;
var ATK={
  slash: {type:'rect',name:'Corte',          wind:.8, rec:.95,len:3.8,w:1.5,dmg:12,parry:true, cost:15,color:0xff4d6d,css:'#ff4d6d'},
  slam:  {type:'circ',name:'Golpe Pesado',   wind:1.2,rec:1.6, rad:5.0,    dmg:26,parry:false,cost:40,color:0xf5a623,css:'#f5a623'},
  charge:{type:'rect',name:'Investida',      wind:1.0,rec:1.4, len:9.0,w:1.3,dmg:20,parry:false,cost:30,color:0xd946ef,css:'#d946ef',dash:8.5}
};

/* skills com cooldown: curtas e fracas ligam o combo, longas e fortes fecham */
Object.keys(ATK).forEach(function(k){ATK[k].key=k;});
var SK=[
  /* skills de UM golpe: rapidas, cancelaveis, servem de ligacao */
  {key:'Q',name:'Avanco',       pose:'dash', cd:4,  dmg:60,  dur:.30,range:3.4,half:1.6,ifr:.32,intr:0,hitk:.9, css:'#5aa9ff'},
  {key:'E',name:'Corte Rapido', pose:'quick',cd:1.6,dmg:28,  dur:.26,range:3.6,half:1.2,ifr:0,  intr:0,hitk:.55,css:'#8bc1ff'},
  {key:'R',name:'Onda',         pose:'wave', cd:8,  dmg:95,  dur:.45,range:4.4,half:3.2,ifr:0,  intr:1,hitk:.55,css:'#8b7bff'},
  /* skills de VARIOS golpes: demoradas, com armadura enquanto duram (comprometem o jogador) */
  {key:'F',name:'Execucao',     pose:'ult',  cd:20, dmg:90,  dur:.70,range:4.6,half:1.5,ifr:0,  intr:2,hitk:.55,css:'#f5c451',hits:[.25,.35,.45,.55],armor:true},
  {key:'T',name:'Tempestade',   pose:'storm',cd:10, dmg:55,  dur:.70,range:3.8,half:1.4,ifr:0,  intr:1,hitk:.55,css:'#b79cff',hits:[.18,.32,.48,.64],armor:true}
];
var SKEY={q:0,e:1,r:2,f:3,t:4};

/* ---------------- movimentos e reconhecedor ---------------- */
function circlePts(start,dir){var a=[],i;for(i=0;i<=32;i++){var t=start+dir*i/32*Math.PI*2;a.push([.5+.5*Math.cos(t),.5+.5*Math.sin(t)]);}return a;}
var MOVES={
  up:   {id:'up',   name:'Corte Ascendente', key:'1', dmg:7,  pts:[[0,1],[1,0]],        rev:true},
  down: {id:'down', name:'Corte Descendente',key:'2', dmg:8,  pts:[[0,0],[1,1]],        rev:true},
  sweep:{id:'sweep',name:'Varredura',        key:'3', dmg:6,  pts:[[0,0],[1,0]],        rev:true},
  thrust:{id:'thrust',name:'Estocada',       key:'4', dmg:9,  pts:[[0,0],[0,1]],        rev:true},
  wedge:{id:'wedge',name:'Cunha',            key:'5', dmg:10, pts:[[0,0],[.5,1],[1,0]], rev:false},
  spin: {id:'spin', name:'Giro',             key:'6', dmg:11, pts:circlePts(-Math.PI/2,1),rev:false,circle:true}
};
var ORDER=['up','down','sweep','thrust','wedge','spin'];
var KEYMAP={};ORDER.forEach(function(id){KEYMAP[MOVES[id].key]=id;});

var N=48;
function pathLen(p){var d=0,i;for(i=1;i<p.length;i++)d+=dist(p[i-1],p[i]);return d;}
function resample(pts,n){
  var I=pathLen(pts)/(n-1),D=0,p=pts.slice(),out=[p[0]],i;
  for(i=1;i<p.length;i++){
    var d=dist(p[i-1],p[i]);
    if(d>0&&D+d>=I){
      var t=(I-D)/d,q=[p[i-1][0]+t*(p[i][0]-p[i-1][0]),p[i-1][1]+t*(p[i][1]-p[i-1][1])];
      out.push(q);p.splice(i,0,q);D=0;
    }else D+=d;
  }
  while(out.length<n)out.push(p[p.length-1]);
  return out.slice(0,n);
}
function normalize(p){
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  p.forEach(function(q){minx=Math.min(minx,q[0]);maxx=Math.max(maxx,q[0]);miny=Math.min(miny,q[1]);maxy=Math.max(maxy,q[1]);});
  var s=Math.max(maxx-minx,maxy-miny)||1,cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  return p.map(function(q){return [(q[0]-cx)/s,(q[1]-cy)/s];});
}
function prep(p){return normalize(resample(p,N));}
var TEMPLATES=[];
ORDER.forEach(function(id){
  var m=MOVES[id];
  if(m.circle){
    for(var s=0;s<8;s++){[1,-1].forEach(function(dir){TEMPLATES.push({id:id,pts:prep(circlePts(s*Math.PI/4,dir))});});}
  }else{
    TEMPLATES.push({id:id,pts:prep(m.pts)});
    if(m.rev)TEMPLATES.push({id:id,pts:prep(m.pts.slice().reverse())});
  }
});
function recognize(raw){
  if(raw.length<4||pathLen(raw)<40)return null;
  var q=prep(raw),best=null,bd=1e9;
  TEMPLATES.forEach(function(t){
    var d=0,i;for(i=0;i<N;i++)d+=dist(q[i],t.pts[i]);d/=N;
    if(d<bd){bd=d;best=t.id;}
  });
  var quality=clamp(1-bd/0.32,0,1);
  return quality>=0.4?{id:best,q:quality}:{id:null,q:quality};
}
function iconSVG(id,size){
  size=size||26;var m=MOVES[id],pts=m.circle?circlePts(-Math.PI/2,1):m.pts;
  var pad=.14,d=pts.map(function(p,i){return (i?'L':'M')+(pad+p[0]*(1-2*pad)).toFixed(3)+' '+(pad+p[1]*(1-2*pad)).toFixed(3);}).join(' ');
  var s0=pts[0];
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 1 1"><path d="'+d+'" fill="none" stroke="#5aa9ff" stroke-width=".085" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+(pad+s0[0]*(1-2*pad))+'" cy="'+(pad+s0[1]*(1-2*pad))+'" r=".11" fill="#f5c451"/></svg>';
}

/* ---------------- arvore de combos ---------------- */
var COMBOS=[
  {seq:['up','down'],                                  name:'Tesoura',               bonus:15},
  {seq:['up','down','wedge'],                          name:'Tempestade',            bonus:40},
  {seq:['sweep','thrust'],                             name:'Lanca',                 bonus:15},
  {seq:['sweep','thrust','spin'],                      name:'Furacao Perfurante',    bonus:45},
  {seq:['thrust','spin'],                              name:'Redemoinho',            bonus:20},
  {seq:['up','down','sweep','thrust','wedge','spin'],  name:'IS BLADE: Corte Final', bonus:200,secret:true}
];
function mk(d){return {kids:{},skill:null,depth:d,open:0};}
var root=mk(0);
COMBOS.forEach(function(c){
  var n=root;
  c.seq.forEach(function(m,i){
    if(!n.kids[m])n.kids[m]=mk(i+1);
    n=n.kids[m];
    if(!c.secret)n.open++;
  });
  n.skill=c;
});
var WINDOW=1.6;

/* ---------------- cena 3D ---------------- */
var canvas=$('#scene'),renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060d);
scene.fog=new THREE.Fog(0x05060d,22,62);
var camera=new THREE.PerspectiveCamera(46,1,.1,200);

scene.add(new THREE.HemisphereLight(0x5b7bd6,0x14081a,2.2));
var key=new THREE.DirectionalLight(0xbcd2ff,2.6);key.position.set(-6,14,8);scene.add(key);
var rim=new THREE.PointLight(0x8b7bff,70,60,1.6);rim.position.set(0,5,-14);scene.add(rim);

function gridTex(){
  var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');
  g.fillStyle='#070a16';g.fillRect(0,0,256,256);
  g.strokeStyle='rgba(90,169,255,.28)';g.lineWidth=2;g.strokeRect(0,0,256,256);
  g.strokeStyle='rgba(90,169,255,.08)';g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,128);g.lineTo(256,128);g.stroke();
  var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(16,16);return t;
}
var floor=new THREE.Mesh(new THREE.CircleGeometry(24,64),new THREE.MeshStandardMaterial({map:gridTex(),roughness:.9,metalness:.2}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
var ring=new THREE.Mesh(new THREE.TorusGeometry(ARENA+.3,.07,8,128),new THREE.MeshBasicMaterial({color:0x5aa9ff}));
ring.rotation.x=Math.PI/2;ring.position.y=.04;scene.add(ring);
var ring2=new THREE.Mesh(new THREE.TorusGeometry(ARENA+1,.03,8,128),new THREE.MeshBasicMaterial({color:0x8b7bff,transparent:true,opacity:.6}));
ring2.rotation.x=Math.PI/2;ring2.position.y=.04;scene.add(ring2);

var portal=new THREE.Group();portal.position.set(0,6,-22);scene.add(portal);
var pr1=new THREE.Mesh(new THREE.TorusGeometry(5,.22,12,80),new THREE.MeshBasicMaterial({color:0x8b7bff}));portal.add(pr1);
var pr2=new THREE.Mesh(new THREE.TorusGeometry(4.2,.07,8,80),new THREE.MeshBasicMaterial({color:0x5aa9ff}));portal.add(pr2);
portal.add(new THREE.Mesh(new THREE.CircleGeometry(4.9,48),new THREE.MeshBasicMaterial({color:0x2a1f6e,transparent:true,opacity:.55,side:THREE.DoubleSide})));

var pillarMat=new THREE.MeshStandardMaterial({color:0x1a2036,roughness:.9});
var i,a;
for(i=0;i<18;i++){
  a=i/18*Math.PI*2;var rr=ARENA+3+((i*37)%5)*.5,hh=2.5+((i*53)%7)*.6;
  var pl=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,hh,8),pillarMat);
  pl.position.set(Math.cos(a)*rr,hh/2,Math.sin(a)*rr);scene.add(pl);
}
var starGeo=new THREE.BufferGeometry(),sp=new Float32Array(600*3);
for(i=0;i<600;i++){var u=Math.random()*Math.PI*2,v=Math.acos(Math.random()*.9+.05),R=80;sp[i*3]=R*Math.sin(v)*Math.cos(u);sp[i*3+1]=R*Math.cos(v)+8;sp[i*3+2]=-R*Math.sin(v)*Math.sin(u)-10;}
starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xbcd2ff,size:.25,sizeAttenuation:true,fog:false})));
var EMB=110,embGeo=new THREE.BufferGeometry(),ep=new Float32Array(EMB*3),es=[];
for(i=0;i<EMB;i++){ep[i*3]=(Math.random()-.5)*32;ep[i*3+1]=Math.random()*8;ep[i*3+2]=(Math.random()-.5)*32;es.push(.15+Math.random()*.35);}
embGeo.setAttribute('position',new THREE.BufferAttribute(ep,3));

/* converte um clip do Mixamo para os ossos normalizados do VRM (rotacao relativa ao repouso de cada osso) */
function buildClips(rig){
  var hum=rig.vrm.humanoid,restInv=new THREE.Quaternion(),parentRest=new THREE.Quaternion(),qa=new THREE.Quaternion();
  var hipsN=hum.getNormalizedBoneNode('hips');
  Object.keys(MX.assets).forEach(function(name){
    var asset=MX.assets[name],clip=asset.animations[0];
    if(!clip)return;
    asset.updateMatrixWorld(true);
    var mh=asset.getObjectByName('mixamorigHips'),scale=hipsN.position.y/(mh&&mh.position.y>0?mh.position.y:100);
    var tracks=[];
    clip.tracks.forEach(function(track){
      var parts=track.name.split('.'),bn=parts[0],prop=parts[1],short=bn.replace(/^mixamorig:?/,''),vn=MX_MAP[short];
      if(!vn)return;
      var node=hum.getNormalizedBoneNode(vn),mn=asset.getObjectByName(bn);
      if(!node||!mn)return;
      if(prop==='quaternion'){
        mn.getWorldQuaternion(restInv).invert();
        mn.parent.getWorldQuaternion(parentRest);
        var vals=track.values.slice();
        for(var i=0;i<vals.length;i+=4){qa.fromArray(vals,i);qa.premultiply(parentRest).multiply(restInv);qa.toArray(vals,i);}
        tracks.push(new THREE.QuaternionKeyframeTrack(node.name+'.quaternion',track.times,vals));
      }else if(prop==='position'&&short==='Hips'){
        tracks.push(new THREE.VectorKeyframeTrack(node.name+'.position',track.times,Array.prototype.map.call(track.values,function(x){return x*scale;})));
      }
    });
    rig.clips[name]=new THREE.AnimationClip(name,clip.duration,tracks);
  });
}
function playClip(rig,name,o){
  o=o||{};var d=rig&&rig.drv,clip=rig&&rig.clips[name];

  var act=d.actions[name]||(d.actions[name]=d.mixer.clipAction(clip)),f=o.fade===undefined?.15:o.fade;
  if(d.cur&&d.cur!==act)d.cur.fadeOut(f);
  act.reset();act.setLoop(o.once?THREE.LoopOnce:THREE.LoopRepeat,Infinity);act.clampWhenFinished=!!o.once;
  act.timeScale=o.speed||1;act.setEffectiveWeight(1);if(f>0)act.fadeIn(f);act.play();

}

  $('#floats').appendChild(d);setTimeout(function(){d.remove();},1000);
}
function hurtFlash(){var h=$('#hurt');h.classList.add('on');setTimeout(function(){h.classList.remove('on');},90);}

/* ---------------- ataques do jogador ---------------- */
function perform(id,q){
  if(S.pdead||S.stun>0||S.rollT>=0||S.guard)return;
  if(S.st<STROKE_COST){gestMsg('Sem estamina');return;}
  S.st-=STROKE_COST;S.stDelay=.6;tgt=null;tmark.visible=false;
  /* mira automatica: vira para o inimigo se estiver perto */
  var dx=S.ex-S.px,dz=S.ez-S.pz;
  if(!S.dead&&Math.hypot(dx,dz)<11)S.face=Math.atan2(dx,dz);
  var now=performance.now()/1000;
  if(now-S.lastT>WINDOW){S.node=root;S.chain=[];S.hits=0;}
  var child=S.node.kids[id],broke=false;
  if(child){S.node=child;}
  else{
    if(S.node!==root&&S.chain.length>=2&&Object.keys(S.node.kids).length)broke=true;
    S.node=root.kids[id]||root;
    S.chain=[];S.hits=0;
  }
  S.chain.push(id);S.hits++;S.lastT=now;
  var m=MOVES[id],perfect=q>=.72;
  var depth=S.node===root?1:S.node.depth;
  var mult=1+.2*(depth-1)*(S.node===root?0:1);
  var dmg=m.dmg*mult*(perfect?1.25:1);
  var sk=S.node!==root?S.node.skill:null;
  if(sk)dmg+=sk.bonus*(perfect?1.25:1);
  dmg=Math.round(dmg*(.92+Math.random()*.16)*3);
  S.anim=mkAnim(id,dmg,sk,perfect,null);
  if(broke)sysMsg('Combo interrompido. Recomece pelo primeiro golpe.');
  renderChain();renderPanel();
  $('#msg').style.opacity='0';
}
function castSkill(i){
  var sk=SK[i];
  if(S.pdead||S.stun>0||S.rollT>=0||S.guard||S.cd[i]>0)return;
  if(S.anim&&!S.anim.hit)return;/* so cancela depois que o golpe acertou */
  S.cd[i]=sk.cd;tgt=null;tmark.visible=false;
  var dx=S.ex-S.px,dz=S.ez-S.pz;
  if(!S.dead&&Math.hypot(dx,dz)<11)S.face=Math.atan2(dx,dz);
  S.lastT=performance.now()/1000;/* a skill mantem a janela do combo viva */
  if(sk.ifr)S.ifr=sk.ifr;
  var dmg=Math.round(sk.dmg*(sk.hits?sk.hits.length:1)*(.92+Math.random()*.16));
  S.anim=mkAnim(sk.pose,dmg,null,false,sk);
  if(sk.pose==='dash')spark(S.px,1.4,S.pz,2.6,0x5aa9ff,.3);
  $('#msg').style.opacity='0';
}
function applyHit(an){
  if(S.dead)return;
  var dx=S.ex-S.px,dz=S.ez-S.pz,reach=Math.hypot(dx,dz);
  var cone=Math.abs(angDiff(S.face,Math.atan2(dx,dz)));
  var rng=an.skill?an.skill.range:REACH,half=an.skill?an.skill.half:1.3;
  if(an.skill&&an.skill.pose==='wave'){wring.visible=true;wring.userData.t=0;wring.position.x=S.px;wring.position.z=S.pz;}
  if(reach>rng||cone>half){floatText('Errou','#7f8db0',16);return;}
  var E=S.en,dmg=an.dmg,tag='';
  if(an.skill){
    tag=an.skill.name.toUpperCase()+' ';
    var ik=an.skill.intr;
    var first=!an.part||an.part===1;
    if(E.state==='windup'&&(ik===2||(ik===1&&E.atk.type!=='circ'))){setEnemy('stagger',ik===2?1.4:.9);tag+='INTERROMPIDO ';}
    if(first&&(ik===2||an.skill.hits)){banner(an.skill.name.toUpperCase(),an.skill.hits?'VARIOS GOLPES':'SKILL',an.skill.css);S.shake=.5;}
    if(an.part&&an.part>1)tag='';
  }
  if(E.state==='recover'){dmg=Math.round(dmg*1.35);tag+='FRAQUEZA ';}
  if(E.state==='stagger'){dmg=Math.round(dmg*1.75);tag+='ATORDOADA ';}
  if(S.focus>0)dmg=Math.round(dmg*1.3);
  if(an.sk&&E.state==='windup'&&E.atk.parry){setEnemy('stagger',.9);tag='INTERROMPIDO ';}
  var big=!!an.sk||(an.skill&&an.skill.intr>=1),color=an.skill?an.skill.css:(an.sk?(an.sk.secret?'#b79cff':'#f5c451'):(an.perfect?'#f5c451':'#e8f0ff'));
  S.hp=Math.max(0,S.hp-dmg);S.flash=1;S.knock=an.sk?.5:.22;S.shake=an.sk?(an.sk.secret?.45:.28):.12;
  floatText(tag+(an.perfect?'PERFEITO ':'')+dmg,color,big?30:(an.perfect?24:20));
  var tc=an.sk&&an.sk.secret?0xb79cff:0x8bc1ff,hx=S.ex-dx/(reach||1)*.6,hz=S.ez-dz/(reach||1)*.6;
  spark(hx,1.8,hz,big?3.6:2.2,tc,.38);burst(hx,1.8,hz,big?26:10,tc,big?4:2.4);
  if(an.sk){
    banner(an.sk.name.toUpperCase(),an.sk.secret?'COMBO SECRETO':'COMBO',an.sk.secret?'#b79cff':'#f5c451');
    if(an.sk.secret)sysMsg('Voce descobriu uma tecnica oculta: '+an.sk.name);
  }
  if(S.hp<=0){S.dead=true;S.deadT=0;gainXp(180+S.lvl*30);S.kills++;if(boss&&boss.drv)playClip(boss,'boss_stagger',{once:true,speed:.8,fade:.1,hold:99});}
  renderHud();
}
function gainXp(v){
  S.xp+=v;var up=false;
  while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true;}
  if(up)sysMsg('Nivel '+S.lvl+' alcancado. Rank '+rankOf(S.lvl)+'.');
}

/* ---------------- movimento, rolamento e defesa ---------------- */
var keys={},joy=null,cam={yaw:0,pitch:.62,dist:15},tgt=null;
function moveVec(){
  var ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  var iz=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0);
  if(joy){ix+=joy.dx;iz-=joy.dy;}
  var l=Math.hypot(ix,iz);
  if(l<.08){
    /* sem teclas: segue o ponto clicado no chao */
    if(tgt&&!S.pdead){
      var tx=tgt.x-S.px,tz=tgt.z-S.pz,td=Math.hypot(tx,tz);
      if(td<.45){tgt=null;tmark.visible=false;return {x:0,z:0,m:0};}
      return {x:tx/td,z:tz/td,m:1};
    }
    return {x:0,z:0,m:0};
  }
  if(tgt){tgt=null;tmark.visible=false;}
  var m=Math.min(1,l);ix/=l;iz/=l;
  var sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  return {x:-sy*iz+cy*ix,z:-cy*iz-sy*ix,m:m};
}
function doRoll(){
  if(S.pdead||S.stun>0||S.rollT>=0)return;
  var an0=S.anim,armored=an0&&an0.skill&&an0.skill.armor;
  if(armored&&!an0.hit){gestMsg('Skill em andamento: so da para esquivar depois do primeiro golpe');return;}
  var cost=ROLL_COST+(armored?10:0);/* cancelar uma skill de varios golpes custa mais */
  if(S.st<cost){gestMsg('Sem estamina');return;}
  S.st-=cost;S.stDelay=.7;
  var mv=moveVec(),dx,dz;
  if(mv.m>0){dx=mv.x;dz=mv.z;}
  else{var ax=S.px-S.ex,az=S.pz-S.ez,l=Math.hypot(ax,az)||1;dx=ax/l;dz=az/l;}
  S.rollT=0;S.rfx=S.px;S.rfz=S.pz;S.rdx=dx;S.rdz=dz;S.face=Math.atan2(dx,dz);S.anim=null;
  if(clipsOn()&&MX.clips.roll)playClip(vrm,'roll',{once:true,speed:2.8,fade:.06,hold:ROLL_DUR+.02});
  $('#msg').style.opacity='0';
}
function gainFocus(){S.focus=3;}
function separate(){
  var dx=S.px-S.ex,dz=S.pz-S.ez,d=Math.hypot(dx,dz);
  if(d<1.25&&d>0){S.px=S.ex+dx/d*1.25;S.pz=S.ez+dz/d*1.25;}
  var r=Math.hypot(S.px,S.pz);if(r>ARENA){S.px*=ARENA/r;S.pz*=ARENA/r;}
}

/* ---------------- inimigo ---------------- */
function setEnemy(state,dur){var E=S.en;E.state=state;E.t=0;E.dur=dur||0;bossOnState(state);}
function turnTo(want,speed,dt){S.eh+=clamp(angDiff(S.eh,want),-speed*dt,speed*dt);}
function startAttack(d){
  var E=S.en,r=Math.random(),k;
  if(d>6.5)k=r<.7?'charge':'slash';
  else if(d<3)k=r<.5?'slash':(r<.85?'slam':'charge');
  else k=r<.5?'slash':(r<.78?'charge':'slam');
  E.atk=ATK[k];setEnemy('windup',E.atk.wind);
}
function enemyThink(dt){
  var E=S.en;if(S.dead||S.pdead)return;
  E.t+=dt;
  var dx=S.px-S.ex,dz=S.pz-S.ez,d=Math.hypot(dx,dz),want=Math.atan2(dx,dz),f=fwd(S.eh);
  if(E.state==='idle'){
    turnTo(want,3.6,dt);
    if(d>3.5){S.ex+=f[0]*3.0*dt;S.ez+=f[1]*3.0*dt;}
    else if(d<2.2){S.ex-=f[0]*1.5*dt;S.ez-=f[1]*1.5*dt;}
    else{var s=E.strafe*1.4*dt;S.ex+=f[1]*s;S.ez-=f[0]*s;}
    if(E.t>=E.wait)startAttack(d);
  }else if(E.state==='windup'){
    if(E.t<E.atk.wind*.55)turnTo(want,E.atk.type==='circ'?2.4:3.4,dt);
    if(E.t>=E.atk.wind){
      setEnemy('strike',E.atk.dash?.32:.2);E.cx=S.ex;E.cz=S.ez;
      resolveEnemyHit(E.atk);
    }
  }else if(E.state==='strike'){
    if(E.atk.dash){
      var pr=clamp(E.t/.3,0,1),ez=1-Math.pow(1-pr,3),h=fwd(S.eh),dd=E.atk.dash*ez;
      S.ex=E.cx+h[0]*dd;S.ez=E.cz+h[1]*dd;
    }
    if(E.t>=E.dur)setEnemy('recover',E.atk.rec);
  }else if(E.state==='recover'){
    turnTo(want,1.2,dt);
    if(E.t>=E.dur){setEnemy('idle');E.wait=.7+Math.random()*1.0;E.strafe=Math.random()<.5?1:-1;}
  }else if(E.state==='stagger'){
    if(E.t>=E.dur){setEnemy('idle');E.wait=.8+Math.random()*1.0;E.strafe=Math.random()<.5?1:-1;}
  }
  var r=Math.hypot(S.ex,S.ez);if(r>ARENA){S.ex*=ARENA/r;S.ez*=ARENA/r;}
}
function inAtk(atk){
  var rx=S.px-S.ex,rz=S.pz-S.ez,h=fwd(S.eh);
  if(atk.type==='circ')return Math.hypot(rx,rz)<atk.rad;
  var along=rx*h[0]+rz*h[1],side=Math.abs(rx*h[1]-rz*h[0]);
  return along>-.4&&along<atk.len&&side<atk.w;
}
function resolveEnemyHit(atk){
  if(atk===ATK.slam){shock.visible=true;shock.userData.t=0;shock.position.x=S.ex;shock.position.z=S.ez;S.shake=Math.max(S.shake,.3);}
  if(!inAtk(atk)){floatText('Errou','#7f8db0',16,'p');return;}
  if((S.rollT>IFR_A&&S.rollT<IFR_B)||S.ifr>0){
    gainFocus();S.st=Math.min(100,S.st+12);
    floatText('ESQUIVA PERFEITA','#5aa9ff',22,'p');spark(S.px,1.6,S.pz,2.4,0x5aa9ff,.3);return;
  }
  if(S.guard){
    var fp=fwd(S.face);
    if(atk.parry&&S.guardT<=PARRY_W){
      setEnemy('stagger',1.8);gainFocus();S.st=Math.min(100,S.st+18);
      if(clipsOn())playClip(vrm,'parry',{once:true,speed:1.5,fade:.05,hold:.45});
      floatText('PARRY!','#f5c451',30,'p');spark(S.px+fp[0]*.9,1.7,S.pz+fp[1]*.9,3.4,0xf5c451,.4);burst(S.px+fp[0]*.9,1.7,S.pz+fp[1]*.9,18,0xf5c451,3);S.shake=.25;return;
    }
    if(S.st>=atk.cost){
      S.st-=atk.cost;S.stDelay=.9;
      floatText('BLOQUEOU','#8bc1ff',20,'p');spark(S.px+fp[0]*.9,1.7,S.pz+fp[1]*.9,2.0,0x8bc1ff,.3);
      hurtPlayer(Math.round(atk.dmg*.2),true);return;
    }
    S.st=0;S.stDelay=1.2;floatText('GUARDA QUEBRADA','#ff4d6d',22,'p');
    hurtPlayer(atk.dmg,false);S.stun=.9;return;
  }
  /* skill de varios golpes tem armadura: o dano leve nao interrompe, so o golpe pesado em area */
  if(S.anim&&S.anim.skill&&S.anim.skill.armor&&atk.type!=='circ'){
    floatText('ARMADURA','#f5c451',18,'p');hurtPlayer(Math.round(atk.dmg*.5),true,true);return;
  }
  hurtPlayer(atk.dmg,false);S.stun=.45;
}
function hurtPlayer(d,soft,quiet){
  S.php=Math.max(0,S.php-d);S.shake=Math.max(S.shake,soft?.12:.3);
  if(d>0)floatText('-'+d,'#ff4d6d',soft?18:24,'p');
  if(clipsOn()&&!quiet)playClip(vrm,soft?'block_hit':(d>=20?'hit_large':'hit_small'),{once:true,speed:soft?1.6:1.5,fade:.05,hold:soft?.3:.5});
  if(!soft){hurtFlash();S.anim=null;S.chain=[];S.hits=0;S.node=root;renderChain();renderPanel();}
  if(S.php<=0){S.pdead=true;S.pdT=0;banner('VOCE CAIU','tente de novo','#ff4d6d');if(clipsOn())playClip(vrm,'death',{once:true,speed:.9,fade:.1,hold:99});}
  renderHud();
}
function resetDuel(){
  S.php=S.pmax;S.st=100;S.px=0;S.pz=6;S.face=Math.PI;S.ex=0;S.ez=-3;S.eh=0;S.hp=S.maxhp;S.dead=false;S.pdead=false;S.stun=0;S.rollT=-1;S.focus=0;S.guard=false;
  setEnemy('idle');S.en.wait=1.4;S.anim=null;enemy.rotation.z=0;enemy.position.y=0;flip.rotation.x=0;
  if(vrm&&vrm.drv)vrm.drv.hold=0;

/* ---------------- ponteiro: clique anda, arrastar gira a camera, joystick (toque) ---------------- */
var GESTURES=false;   /* gestos desligados por enquanto: com false, o clique esquerdo anda e arrastar gira a camera */
var gc=$('#gest'),gx=gc.getContext('2d'),drawing=false,pts=[],fade=null,gId=null,camDrag=null,clickDrag=null;
var ray=new THREE.Raycaster(),gplane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function clickToMove(cx,cy){

  try{gc.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='mouse'&&e.button===2){camDrag={id:e.pointerId,x:e.clientX,y:e.clientY};return;}
  if(e.pointerType==='touch'&&e.clientX<innerWidth*.4&&!joy){joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0,x:e.clientX,y:e.clientY};return;}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(GESTURES){
    if(gId!==null)return;
    gId=e.pointerId;drawing=true;pts=[[e.clientX,e.clientY]];fade=null;return;
  }
  if(clickDrag===null)clickDrag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,atk:false,t0:performance.now()};
});
gc.addEventListener('pointermove',function(e){
  if(camDrag&&e.pointerId===camDrag.id){
    cam.yaw-=(e.clientX-camDrag.x)*.006;cam.pitch=clamp(cam.pitch+(e.clientY-camDrag.y)*.005,.2,1.3);
    camDrag.x=e.clientX;camDrag.y=e.clientY;
  }else if(clickDrag&&e.pointerId===clickDrag.id){
    var cdx=e.clientX-clickDrag.x,cdy=e.clientY-clickDrag.y;
    if(!clickDrag.atk&&!clickDrag.moved&&Math.hypot(cdx,cdy)>(e.pointerType==='mouse'?14:6))clickDrag.moved=true;
    /* no mouse so o botao direito gira a camera; no toque, arrastar gira */
    if(clickDrag.moved&&!clickDrag.atk&&e.pointerType!=='mouse'){
      cam.yaw-=cdx*.006;cam.pitch=clamp(cam.pitch+cdy*.005,.2,1.3);
      clickDrag.x=e.clientX;clickDrag.y=e.clientY;
    }
  }else if(joy&&e.pointerId===joy.id){
    var dx=e.clientX-joy.ox,dy=e.clientY-joy.oy,l=Math.hypot(dx,dy)||1,m=Math.min(l,60)/60;
    joy.dx=dx/l*m;joy.dy=dy/l*m;joy.x=joy.ox+joy.dx*60;joy.y=joy.oy+joy.dy*60;
  }else if(drawing&&e.pointerId===gId)pts.push([e.clientX,e.clientY]);
});
function pointerEnd(e){
  if(camDrag&&e.pointerId===camDrag.id)camDrag=null;
  else if(clickDrag&&e.pointerId===clickDrag.id){
    var wasMoved=clickDrag.moved,wasAtk=clickDrag.atk;clickDrag=null;
    if(!wasMoved&&!wasAtk&&e.type==='pointerup')clickToMove(e.clientX,e.clientY);
  }
  else if(joy&&e.pointerId===joy.id)joy=null;
  else if(e.pointerId===gId){gId=null;endStroke();}
}
gc.addEventListener('pointerup',pointerEnd);
gc.addEventListener('pointercancel',pointerEnd);
gc.addEventListener('wheel',function(e){e.preventDefault();cam.dist=clamp(cam.dist+e.deltaY*.02,8,30);},{passive:false});
function endStroke(){
  if(!drawing)return;drawing=false;
  var r=recognize(pts);fade={pts:pts.slice(),t:0,ok:!!(r&&r.id)};
  if(r&&r.id){perform(r.id,r.q);gestMsg(MOVES[r.id].name+'  '+Math.round(r.q*100)+'%'+(r.q>=.72?'  PERFEITO':''));}
  else if(r){gestMsg('Gesto nao reconhecido');}
  pts=[];
}
var gmT;
function gestMsg(t){var e=$('#msg');e.textContent=t;e.style.opacity='1';clearTimeout(gmT);gmT=setTimeout(function(){e.style.opacity='0';},1100);}
function drawTrail(list,alpha,ok){
  if(list.length<2)return;
  gx.lineCap='round';gx.lineJoin='round';
  gx.strokeStyle='rgba('+(ok===false?'255,77,109':'90,169,255')+','+(.28*alpha)+')';gx.lineWidth=16;
  gx.beginPath();list.forEach(function(p,i){i?gx.lineTo(p[0],p[1]):gx.moveTo(p[0],p[1]);});gx.stroke();
  gx.strokeStyle='rgba(232,240,255,'+alpha+')';gx.lineWidth=3.5;
  gx.beginPath();list.forEach(function(p,i){i?gx.lineTo(p[0],p[1]):gx.moveTo(p[0],p[1]);});gx.stroke();
}
function drawJoy(){
  if(!joy)return;
  gx.strokeStyle='rgba(90,169,255,.5)';gx.lineWidth=3;gx.beginPath();gx.arc(joy.ox,joy.oy,60,0,7);gx.stroke();
  gx.fillStyle='rgba(90,169,255,.4)';gx.beginPath();gx.arc(joy.x,joy.y,24,0,7);gx.fill();
}

/* ---------------- loop ---------------- */
function resize(){
  var w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  gc.width=w*d;gc.height=h*d;gx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);resize();

var STATE_TXT={
  idle:['A sentinela observa...','#7f8db0'],
  recover:['ABERTA! Ataque agora (+35% de dano)','#f5c451'],
  stagger:['ATORDOADA! (+75% de dano)','#5aa9ff']
};
var focus=new THREE.Vector3(0,1,6);

var BASIC=['sweep','thrust','spin'];/* sequencia do ataque basico: Lanca -> Furacao Perfurante, em loop */
function basicTick(){
  if(!clickDrag||clickDrag.moved)return;
  if(!clickDrag.atk&&performance.now()-clickDrag.t0>200)clickDrag.atk=true;
  if(!clickDrag.atk)return;
  if(S.anim||S.pdead||S.stun>0||S.rollT>=0||S.guard)return;
  var now=performance.now()/1000;
  var d=(now-S.lastT>WINDOW||S.node===root)?0:S.node.depth;
  perform(BASIC[d%BASIC.length],.5);
}
function frame2(dt,T){
  if(tmark.visible)tmark.scale.setScalar(1+.12*Math.sin(T*8));
  basicTick();
  /* ---- jogador ---- */
  var mv=moveVec(),canWalk=!S.pdead&&S.stun<=0&&S.rollT<0&&!S.anim;
  S.walking=false;S.mvm=0;
  if(canWalk&&mv.m>0){
    var spd=(S.guard?2.2:RUN)*mv.m;S.mvm=mv.m*(S.guard?.45:1);
    S.px+=mv.x*spd*dt;S.pz+=mv.z*spd*dt;S.walking=true;
    if(!S.guard){var tf=Math.atan2(mv.x,mv.z);S.face+=clamp(angDiff(S.face,tf),-10*dt,10*dt);}
  }
  if(S.guard&&!S.dead){S.face+=clamp(angDiff(S.face,Math.atan2(S.ex-S.px,S.ez-S.pz)),-10*dt,10*dt);}
  S.stun=Math.max(0,S.stun-dt);S.gcd=Math.max(0,S.gcd-dt);S.focus=Math.max(0,S.focus-dt);S.ifr=Math.max(0,S.ifr-dt);
  SK.forEach(function(s,n){S.cd[n]=Math.max(0,S.cd[n]-dt);});
  updateSkillUI();
  if(wring.visible){
    wring.userData.t+=dt;var wk=wring.userData.t/.4;
    if(wk>=1)wring.visible=false;
    else{var ws=SK[2].range*(.3+wk*.8);wring.scale.set(ws,ws,1);wring.material.opacity=.85*(1-wk);}
  }

  var canGuard=S.guardHeld&&!S.anim&&S.rollT<0&&S.stun<=0&&!S.pdead&&S.st>0&&S.gcd<=0;
  if(canGuard&&!S.guard){S.guard=true;S.guardT=0;}
  else if(!canGuard&&S.guard){S.guard=false;S.gcd=.3;}
  if(S.guard)S.guardT+=dt;

  if(S.rollT>=0){
    S.rollT+=dt;var pr=clamp(S.rollT/ROLL_DUR,0,1),ez=1-Math.pow(1-pr,2);
    S.px=S.rfx+S.rdx*ROLL_DIST*ez;S.pz=S.rfz+S.rdz*ROLL_DIST*ez;
    if(!clipsOn())flip.rotation.x=Math.PI*2*pr;
    if(pr>=1){S.rollT=-1;flip.rotation.x=0;}
  }

  if(S.stDelay>0)S.stDelay-=dt;else S.st=Math.min(100,S.st+(S.guard?9:26)*dt);

  S.lv=0;
  var an=S.anim;
  if(an&&an.clipMode){
    an.tt+=dt;
    var lp0=clamp((an.tt-dt-an.hitT*.35)/(an.hitT*.75),0,1),lp1=clamp((an.tt-an.hitT*.35)/(an.hitT*.75),0,1);
    var f2=fwd(S.face),dl2=an.lg*(lp1*lp1*(3-2*lp1)-lp0*lp0*(3-2*lp0));
    S.px+=f2[0]*dl2;S.pz+=f2[1]*dl2;S.lv=dl2/Math.max(dt,.001);
    if(an.hitList){
      while(an.hi<an.hitList.length&&an.tt>=an.hitList[an.hi].t){
        var hh=an.hitList[an.hi++];an.hit=true;
        applyHit({id:an.id,dmg:hh.dmg,sk:null,perfect:false,skill:an.skill,part:an.hi,parts:an.hitList.length});
      }
    }else if(!an.hit&&an.tt>=an.hitT){an.hit=true;applyHit(an);}
    if(an.tt>=an.total)S.anim=null;
  }else if(an){
    an.t+=dt/an.dur;var P=POSE[an.id],t=an.t,wp=.35;
    if(t<wp){
      var k=t/wp;k=k*k*(3-2*k);
      S.cur.th=lerp(an.from.th,P.w,k);S.cur.yaw=lerp(an.from.yaw,P.yw,k);
    }else{
      var kk=clamp((t-wp)/(1-wp),0,1);kk=1-Math.pow(1-kk,3);
      S.cur.th=lerp(P.w,P.e,kk);S.cur.yaw=lerp(P.yw,P.ye,kk);
      var f=fwd(S.face),dl=P.lg*(kk-an.pk);an.pk=kk;
      S.px+=f[0]*dl;S.pz+=f[1]*dl;S.lv=dl/Math.max(dt,.001);
      if(kk>=(an.skill?an.skill.hitk:.55)&&!an.hit){an.hit=true;applyHit(an);}
    }
    if(t>=1.2){if(P.spin)S.cur.yaw=0;S.anim=null;}
  }else{
    var r=1-Math.pow(.0005,dt),tg=S.guard?GUARD:IDLE;
    S.cur.th=lerp(S.cur.th,tg.th,r);S.cur.yaw=lerp(S.cur.yaw,tg.yaw,r);
  }
  if(!S.pdead)separate();
  pivot.rotation.x=S.cur.th;
  player.rotation.y=S.cur.yaw;
  wrap.position.set(S.px,Math.sin(T*2)*.02,S.pz);
  wrap.rotation.y=S.face;
  if(S.pdead){
    S.pdT+=dt;var fpp=Math.min(1,S.pdT/.5);if(!clipsOn()){flip.rotation.x=-1.45*fpp;flip.position.y=1.1-fpp*.7;}
    if(S.pdT>2.4){flip.position.y=1.1;resetDuel();}
  }else{
    flip.position.y=1.1;
    if(S.stun>0&&S.rollT<0){if(!clipsOn())flip.rotation.x=-.2*Math.sin(Math.min(1,S.stun*3)*Math.PI);}
    else if(S.rollT<0)flip.rotation.x=0;
  }
  var sw=S.walking?Math.sin(T*12)*.8:0;legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;
  if(vrm&&vrm.drv){playerLoco();updateRig(vrm,dt);}
  shield.visible=shieldRing.visible=S.guard;
  if(S.guard){
    var par=S.guardT<=PARRY_W;
    shield.material.color.setHex(par?0xf5c451:0x5aa9ff);shieldRing.material.color.setHex(par?0xfff2c0:0xbcd2ff);
    shield.material.opacity=par?.7:.3+Math.sin(T*8)*.06;
  }
  pmark.position.x=S.px;pmark.position.z=S.pz;

  /* ---- inimigo ---- */
  enemyThink(dt);
  var E=S.en,atk=E.atk,eth=-.25,tint=0;
  decalRect.visible=decalCirc.visible=false;
  if(!S.dead){
    if(E.state==='windup'){
      var wpg=clamp(E.t/atk.wind,0,1),top=atk.type==='circ'?3.0:2.6;
      eth=lerp(-.25,top,wpg*wpg*(3-2*wpg));E.top=top;
      tint=.35+.4*Math.sin(E.t*18);
      var op=.12+.55*wpg;
      decalG.position.set(S.ex,0,S.ez);decalG.rotation.y=S.eh;
      if(atk.type==='circ'){decalCirc.visible=true;decalCirc.scale.set(atk.rad,atk.rad,1);decalCirc.material.color.setHex(atk.color);decalCirc.material.opacity=op;}
      else{decalRect.visible=true;decalRect.scale.set(atk.w*2,atk.len,1);decalRect.position.z=atk.len/2;decalRect.material.color.setHex(atk.color);decalRect.material.opacity=op;}
    }else if(E.state==='strike'){
      var sp3=clamp(E.t/.12,0,1);eth=lerp(E.top,atk.type==='circ'?-.1:-1.5,sp3);E.end=eth;
    }else if(E.state==='recover'){
      eth=lerp(E.end,-.25,clamp(E.t/E.dur,0,1)*.9);
    }else if(E.state==='stagger'){eth=.9;}
  }
  ePivot.rotation.x=lerp(ePivot.rotation.x,eth,E.state==='windup'?1:Math.min(1,dt*18));
  if(boss){
    var esp=Math.hypot(S.ex-S.pex,S.ez-S.pez)/Math.max(dt,.001);S.pex=S.ex;S.pez=S.ez;
    var dashing=E.state==='strike'&&atk&&atk.dash;
    if(boss.drv){
      var bd=boss.drv;
      if(bd.hold<=0&&!S.dead){var wantB=esp>.4&&!dashing?'boss_run':'boss_idle';if(bd.curName!==wantB)playClip(boss,wantB,{fade:.25});}
      updateRig(boss,dt);
    }
  }
  S.knock=Math.max(0,S.knock-dt*1.6);S.flash=Math.max(0,S.flash-dt*5);
  var ec=atk&&E.state==='windup'?(atk.type==='circ'?[1,.55,.1]:(atk.dash?[.85,.3,.95]:[1,.15,.3])):[0,0,0];
  emats.forEach(function(mt){
    if(mt.color.getHex()===0xff4d6d)return;
    var fl=S.flash*.55;mt.emissive.setRGB(Math.max(fl,ec[0]*tint),Math.max(fl,ec[1]*tint),Math.max(fl*1.6,ec[2]*tint));
  });
  if(boss){
    var bf=S.flash*.55;
    boss.mats.forEach(function(o){o.m.emissive.setRGB(o.e.r+Math.max(bf,ec[0]*tint)*.55,o.e.g+Math.max(bf,ec[1]*tint)*.55,o.e.b+Math.max(bf*1.6,ec[2]*tint)*.55);});
  }
  enemy.position.set(S.ex,0,S.ez);enemy.rotation.y=S.eh;
  if(S.dead){
    S.deadT+=dt;
    enemy.rotation.x=lerp(0,-1.45,Math.min(1,S.deadT/.45));
    enemy.position.y=lerp(0,-.35,Math.min(1,S.deadT/.45));
    if(S.deadT>1.6){S.dead=false;S.hp=S.maxhp;enemy.rotation.x=0;enemy.position.y=0;setEnemy('idle');S.en.wait=1.2;renderHud();}
  }else{
    var kb=fwd(S.eh);enemy.position.x-=kb[0]*S.knock*.8;enemy.position.z-=kb[1]*S.knock*.8;
    enemy.rotation.x=E.state==='stagger'?-.28:-S.knock*.25;
  }
  if(shock.visible){
    shock.userData.t+=dt;var sk2=shock.userData.t/.4;
    if(sk2>=1)shock.visible=false;
    else{var sc=ATK.slam.rad*(.3+sk2*.9);shock.scale.set(sc,sc,1);shock.material.opacity=.8*(1-sk2);}
  }

  /* ---- hud de estado ---- */
  var st=$('#estate'),txt,colr;
  if(S.dead){txt='DERROTADA';colr='#f5c451';}
  else if(E.state==='windup'){
    txt=atk.parry?'GOLPE! Espaco na hora = PARRY (ou esquive)':(atk.dash?'INVESTIDA! Saia da linha ou esquive (Shift)':'PESADO! Saia do circulo ou esquive (Shift)');colr=atk.css;
  }else if(E.state==='strike'){txt=atk.name.toUpperCase();colr=atk.css;}
  else{var q=STATE_TXT[E.state]||STATE_TXT.idle;txt=q[0];colr=q[1];}
  st.textContent=txt;st.style.color=colr;
  $('#stfill').style.width=S.st+'%';
  $('#focus').textContent=S.focus>0?('FOCO  +30% de dano  '+S.focus.toFixed(1)+'s'):'';
}

var last=performance.now(),T=0;
function frame(nowMs){
  var dt=Math.min(.05,(nowMs-last)/1000);last=nowMs;T+=dt;
  frame2(dt,T);

  S.shake=Math.max(0,S.shake-dt*1.8);
  focus.lerp((DBG&&DBG.who==='boss')?new THREE.Vector3(S.ex,1.6,S.ez):new THREE.Vector3(S.px,1.2,S.pz),1-Math.pow(.003,dt));
  var narrow=innerWidth/innerHeight<1.2?(1.2-innerWidth/innerHeight)*9:0;
  var dd=cam.dist+narrow,cp=Math.cos(cam.pitch);
  camera.position.set(focus.x+Math.sin(cam.yaw)*cp*dd+(Math.random()-.5)*S.shake,focus.y+Math.sin(cam.pitch)*dd+(Math.random()-.5)*S.shake*.6,focus.z+Math.cos(cam.yaw)*cp*dd);
  camera.lookAt(focus.x,focus.y+.6,focus.z);
  portal.rotation.z+=dt*.25;pr2.rotation.z-=dt*.5;ring2.rotation.z+=dt*.1;
  var ap=embGeo.attributes.position.array;
  for(var q=0;q<EMB;q++){ap[q*3+1]+=es[q]*dt;if(ap[q*3+1]>8)ap[q*3+1]=0;}
  embGeo.attributes.position.needsUpdate=true;
  for(var f=fx.length-1;f>=0;f--){
    var e=fx[f];e.t+=dt;var p=e.t/e.life;
    if(p>=1){scene.remove(e.o);e.o.material.dispose();fx.splice(f,1);continue;}
    if(e.kind==='spark'){var sc2=e.size*(.3+p*1.4);e.o.scale.set(sc2,sc2,1);e.o.material.opacity=1-p;}
    else{e.o.position.x+=e.vx*dt;e.o.position.y+=e.vy*dt;e.o.position.z+=e.vz*dt;e.vy-=5*dt;e.o.material.opacity=1-p;}
  }
  renderer.render(scene,camera);

  var wl=S.node!==root?clamp(1-(performance.now()/1000-S.lastT)/WINDOW,0,1):0;
  $('#winbar div').style.width=(wl*100)+'%';
  if(wl===0&&S.chain.length&&S.node!==root){S.node=root;S.chain=[];S.hits=0;renderChain();renderPanel();}

  gx.clearRect(0,0,innerWidth,innerHeight);
  if(drawing)drawTrail(pts,1,true);
  else if(fade){fade.t+=dt;var al=1-fade.t/.45;if(al<=0)fade=null;else drawTrail(fade.pts,al,fade.ok);}
  drawJoy();
  requestAnimationFrame(frame);
}
buildPad();buildSkills();renderHud();renderChain();renderPanel();
loadClips();
loadRig('assets/Talibrac.vrm',2.45,{blade:0xdfe8ff,emis:0x3a5fb0,glow:0x5aa9ff,guard:0x8b7bff},function(r){
  player.children.forEach(function(c){if(c!==shield&&c!==shieldRing)c.visible=false;});
  player.add(r.root);vrm=r;gestMsg('Talibrac carregado');tryInit();
});
loadRig('assets/Talibrac2.vrm',3.5,{blade:0xffb0c0,emis:0x992244,glow:0xff4d6d,guard:0xff4d6d},function(r){
  enemy.children.forEach(function(c){c.visible=false;});
  enemy.add(r.root);boss=r;tryInit();
});
requestAnimationFrame(frame);
})();
</script>
